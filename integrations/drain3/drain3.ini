[DRAIN]
sim_th = 0.5
depth = 4
max_children = 100
max_clusters = 1000
extra_delimiters = ["_"]

[MASKING]
mask_prefix = <:
mask_suffix = :>
masking = [
    {"regex_pattern": "((?<=[^A-Za-z0-9])|^)([0-9]{1,3}\\.){3}[0-9]{1,3}((?=[^A-Za-z0-9])|$)", "mask_with": "IP"},
    {"regex_pattern": "((?<=[^A-Za-z0-9])|^)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}((?=[^A-Za-z0-9])|$)", "mask_with": "UUID"}
    ]
