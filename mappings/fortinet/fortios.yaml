# Fortinet FortiOS Firewall & Traffic Log Mapping to OCSF
vendor: "Fortinet"
product: "FortiOS"
format: "syslog"
match_pattern: "(?:type=(?:traffic|event|utm|attack)|devname=)"
field_mapping:
  date: "date"
  time: "time"
  devname: "log_name"
  srcip: "src_ip"
  srcaddr: "src_ip"
  dstip: "dst_ip"
  dstaddr: "dst_ip"
  srcport: "src_port"
  dstport: "dst_port"
  proto: "protocol"
  action: "activity_name"
  status: "status"
  level: "severity"
  user: "user"
  msg: "message"
  sentbyte: "traffic_bytes"
  rcvdbyte: "traffic_bytes"
  sentpkt: "traffic_packets"
  rcvdpkt: "traffic_packets"
category: "Network Activity"
class: "Network Activity"
