      async loadExplorerFilterOptions() {
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http') || this.explorerState.customLoadedEvents) {
          const evts = this.explorerState.customLoadedEvents || OFFLINE_EXPLORER_DATASET;
          const sources = [...new Set(evts.map(e => e.source_display || e.src_hostname).filter(Boolean))].sort();
          const severities = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFO'];
          const classes = [...new Set(evts.map(e => e.ocsf_display || e.class_name).filter(Boolean))].sort();
          const types = [...new Set(evts.map(e => e.event_type_display || e.activity_name).filter(Boolean))].sort();
          const formats = [...new Set(evts.map(e => e.log_format).filter(Boolean))].sort();
          this.explorerState.filterOptions = {
            sources: sources.length ? sources : this.explorerState.filterOptions.sources,
            severities: severities,
            ocsf_classes: classes.length ? classes : this.explorerState.filterOptions.ocsf_classes,
            event_types: types.length ? types : this.explorerState.filterOptions.event_types,
            formats: formats.length ? formats : this.explorerState.filterOptions.formats
          };
          return;
        }

        try {
          const res = await fetch('/events/filter-options');
          if (res.ok) {
            const data = await res.json();
            this.explorerState.filterOptions = {
              sources: data.sources || this.explorerState.filterOptions.sources,
              severities: data.severities || this.explorerState.filterOptions.severities,
              ocsf_classes: data.ocsf_classes || this.explorerState.filterOptions.ocsf_classes,
              event_types: data.event_types || this.explorerState.filterOptions.event_types,
              formats: data.formats || this.explorerState.filterOptions.formats
            };
          }
        } catch (e) {
          // In offline mode, default filterOptions in constructor will be used
        }
      }

      async loadExplorerEvents() {
        this.explorerState.loading = true;
        this.explorerState.error = null;
        if (this.currentPage === 'explorer') {
          this.renderView();
        }

        this.loadExplorerFilterOptions();

        // Standalone offline execution (file: protocol or custom loaded file): 100% offline, zero localhost network calls!
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http') || this.explorerState.customLoadedEvents) {
          this.executeOfflineExplorerQuery();
          return;
        }

        const offset = (this.explorerState.page - 1) * this.explorerState.pageSize;
        const params = new URLSearchParams({
          limit: this.explorerState.pageSize,
          offset: offset,
          order_by: this.explorerState.sortOrder || 'created_at',
          direction: 'desc'
        });

        if (this.explorerState.searchVal) {
          params.append('search', this.explorerState.searchVal);
        }
        if (this.explorerState.sourceFilter && this.explorerState.sourceFilter !== 'all') {
          params.append('source', this.explorerState.sourceFilter);
        }
        if (this.explorerState.severityFilter && this.explorerState.severityFilter !== 'all') {
          params.append('severity', this.explorerState.severityFilter);
        }
        if (this.explorerState.integrityFilter && this.explorerState.integrityFilter !== 'all') {
          params.append('integrity', this.explorerState.integrityFilter);
        }
        if (this.explorerState.timeRange && this.explorerState.timeRange !== 'all') {
          params.append('time_range', this.explorerState.timeRange);
        }
        if (this.explorerState.ocsfFilter && this.explorerState.ocsfFilter !== 'all') {
          params.append('ocsf', this.explorerState.ocsfFilter);
        }
        if (this.explorerState.eventTypeFilter && this.explorerState.eventTypeFilter !== 'all') {
          params.append('event_type', this.explorerState.eventTypeFilter);
        }
        if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
          params.append('format', this.explorerState.formatFilter);
        }

        try {
          const res = await fetch('/events?' + params.toString());
          if (res.ok) {
            const data = await res.json();
            this.state.events = data.events || [];
            this.state.totalEvents = data.total || 0;
            this.explorerState.offlineMode = false;
            this.explorerState.loading = false;
            if (this.currentPage === 'explorer') this.renderView();
            return;
          }
          throw new Error('API returned ' + res.status);
        } catch (err) {
          // Use authentic offline dataset seamlessly
          this.executeOfflineExplorerQuery();
        }
      }

      importLocalLogFile(event) {
        const file = event.target && event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            let parsed = [];
            if (file.name.endsWith('.json')) {
              const json = JSON.parse(text);
              parsed = Array.isArray(json) ? json : (json.events || [json]);
            } else {
              const lines = text.split(/\r?\n/).filter(Boolean);
              parsed = lines.map((line, idx) => {
                try { return JSON.parse(line); }
                catch {
                  return {
                    event_id: 'LOG-' + (idx + 1).toString().padStart(5, '0'),
                    timestamp: new Date().toISOString().replace('T', ' ').slice(0, 19),
                    source_display: file.name,
                    src_hostname: file.name.split('.')[0],
                    event_type_display: 'Imported Entry',
                    ocsf_display: 'Security Log',
                    severity_clean: 'INFO',
                    severity: 'INFO',
                    integrity_status: 'VERIFIED',
                    message: line.slice(0, 120),
                    raw_event: line,
                    blockchain_proof: {
                      status: 'VERIFIED',
                      block_index: idx + 1,
                      event_hash: 'IMPORTED_' + idx,
                      expected_hash: 'IMPORTED_' + idx
                    }
                  };
                }
              });
            }
            this.explorerState.customLoadedEvents = parsed;
            this.explorerState.customLoadedFileName = file.name;
            this.explorerState.page = 1;
            this.showToast(`Loaded ${parsed.length.toLocaleString()} local events from ${file.name}`);
            this.loadExplorerEvents();
          } catch (err) {
            alert('Error loading local log file: ' + err.message);
          }
        };
        reader.readAsText(file);
      }

      executeOfflineExplorerQuery() {
        this.explorerState.offlineMode = true;
        this.explorerState.loading = false;

        const baseEvents = this.explorerState.customLoadedEvents || OFFLINE_EXPLORER_DATASET;
        let filtered = baseEvents.slice();

        // 1. Search / Lucene query
        const query = (this.explorerState.searchVal || '').trim();
        if (query) {
          const terms = query.split(/\s+/);
          for (const term of terms) {
            if (!term) continue;
            if (term.includes(':')) {
              const colonIdx = term.indexOf(':');
              const field = term.slice(0, colonIdx).toLowerCase();
              const val = term.slice(colonIdx + 1).toLowerCase().replace(/\*/g, '');
              filtered = filtered.filter(e => {
                if (field === 'source.ip' || field === 'src_ip' || field === 'ip') {
                  return (e.src_ip && e.src_ip.toLowerCase().includes(val)) || (e.dst_ip && e.dst_ip.toLowerCase().includes(val));
                }
                if (field === 'event.action' || field === 'action') {
                  return e.action && e.action.toLowerCase().includes(val);
                }
                if (field === 'severity') {
                  return (e.severity && e.severity.toLowerCase().includes(val)) || (e.severity_clean && e.severity_clean.toLowerCase().includes(val));
                }
                if (field === 'source' || field === 'host') {
                  return (e.source_display && e.source_display.toLowerCase().includes(val)) || (e.src_hostname && e.src_hostname.toLowerCase().includes(val));
                }
                if (field === 'id' || field === 'event_id') {
                  return e.event_id && e.event_id.toLowerCase().includes(val);
                }
                if (field === 'ocsf' || field === 'class') {
                  return (e.ocsf_display && e.ocsf_display.toLowerCase().includes(val)) || (e.class_name && e.class_name.toLowerCase().includes(val));
                }
                const fVal = String(e[field] || '').toLowerCase();
                return fVal.includes(val);
              });
            } else {
              const termLower = term.toLowerCase();
              filtered = filtered.filter(e => {
                const combined = [
                  e.event_id,
                  e.timestamp,
                  e.source_display,
                  e.src_hostname,
                  e.event_type_display,
                  e.ocsf_display,
                  e.severity,
                  e.src_ip,
                  e.dst_ip,
                  e.user,
                  e.action,
                  e.disposition,
                  e.message,
                  e.raw_event
                ].filter(Boolean).join(' ').toLowerCase();
                return combined.includes(termLower);
              });
            }
          }
        }

        // 2. Source filter
        if (this.explorerState.sourceFilter && this.explorerState.sourceFilter !== 'all') {
          const sFilter = this.explorerState.sourceFilter.toLowerCase();
          filtered = filtered.filter(e => 
            (e.source_display && e.source_display.toLowerCase() === sFilter) || 
            (e.src_hostname && e.src_hostname.toLowerCase() === sFilter) || 
            (e.source_file && e.source_file.toLowerCase().includes(sFilter))
          );
        }

        // 3. Severity filter
        if (this.explorerState.severityFilter && this.explorerState.severityFilter !== 'all') {
          const sev = this.explorerState.severityFilter.toLowerCase();
          if (sev === 'high+') {
            filtered = filtered.filter(e => {
              const s = (e.severity_clean || e.severity || '').toUpperCase();
              return s === 'CRITICAL' || s === 'HIGH' || s === 'FATAL' || s === 'ERROR';
            });
          } else {
            filtered = filtered.filter(e => (e.severity_clean || e.severity || '').toLowerCase() === sev);
          }
        }

        // 4. Integrity filter
        if (this.explorerState.integrityFilter && this.explorerState.integrityFilter !== 'all') {
          const st = this.explorerState.integrityFilter.toLowerCase();
          filtered = filtered.filter(e => {
            const status = (e.integrity_status || (e.blockchain_proof && e.blockchain_proof.status) || 'PENDING').toLowerCase();
            return status === st;
          });
        }

        // 5. OCSF class filter
        if (this.explorerState.ocsfFilter && this.explorerState.ocsfFilter !== 'all') {
          const ocsfVal = this.explorerState.ocsfFilter.toLowerCase();
          filtered = filtered.filter(e => (e.ocsf_display && e.ocsf_display.toLowerCase() === ocsfVal) || (e.class_name && e.class_name.toLowerCase() === ocsfVal));
        }

        // 6. Event type filter
        if (this.explorerState.eventTypeFilter && this.explorerState.eventTypeFilter !== 'all') {
          const etVal = this.explorerState.eventTypeFilter.toLowerCase();
          filtered = filtered.filter(e => (e.event_type_display && e.event_type_display.toLowerCase() === etVal) || (e.activity_name && e.activity_name.toLowerCase() === etVal));
        }

        // 7. Format filter
        if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
          const fmt = this.explorerState.formatFilter.toLowerCase();
          filtered = filtered.filter(e => e.log_format && e.log_format.toLowerCase() === fmt);
        }

        this.state.totalEvents = filtered.length;

        // 8. Pagination
        const start = (this.explorerState.page - 1) * this.explorerState.pageSize;
        const pageEvents = filtered.slice(start, start + this.explorerState.pageSize);
        this.state.events = pageEvents;

        if (this.currentPage === 'explorer') {
          this.renderView();
        }
      }

      toggleAddFilterModal(isOpen) {

      onAddFilterFieldChange(field) {
        const cont = document.getElementById('add-filter-val-container');
        if (!cont) return;
        const opts = this.explorerState.filterOptions || {};
        if (field === 'ocsf') {
          const classes = opts.ocsf_classes || [];
          cont.innerHTML = `
            <label class="block text-outline uppercase font-bold text-[10px] mb-1">Select OCSF Class</label>

              ${classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}

          `;
        } else if (field === 'format') {
          const fmts = opts.formats || ['syslog', 'json', 'xml', 'generic', 'cef', 'leef', 'csv', 'android'];
          cont.innerHTML = `
            <label class="block text-outline uppercase font-bold text-[10px] mb-1">Select Format</label>
            <select id="add-filter-value" class="w-full bg-surface-container-lowest border border-outline-variant rounded p-2 text-on-surface font-code-xs">
              ${fmts.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f.toUpperCase())}</option>`).join('')}
            </select>
          `;

          const types = opts.event_types || [];
          cont.innerHTML = `
            <label class="block text-outline uppercase font-bold text-[10px] mb-1">Select Event Type</label>
            <select id="add-filter-value" class="w-full bg-surface-container-lowest border border-outline-variant rounded p-2 text-on-surface font-code-xs">
              ${types.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}

          `;

          cont.innerHTML = `
            <label class="block text-outline uppercase font-bold text-[10px] mb-1">Filter Value</label>

      applyCustomFilter() {
        const fieldEl = document.getElementById('add-filter-field');
        const valEl = document.getElementById('add-filter-value');
        if (!fieldEl || !valEl) return;
        const field = fieldEl.value;
        const val = valEl.value.trim();
        if (!val) return;

        if (field === 'ocsf') {
          this.explorerState.ocsfFilter = val;
        } else if (field === 'event_type') {
          this.explorerState.eventTypeFilter = val;
        } else if (field === 'format') {
          this.explorerState.formatFilter = val;
        } else if (field === 'source') {
          this.explorerState.sourceFilter = val;
        } else if (field === 'ip') {
          this.explorerState.searchVal = (this.explorerState.searchVal ? this.explorerState.searchVal + ' ' : '') + `source.ip:${val}`;
        }

        this.toggleAddFilterModal(false);
        this.explorerState.page = 1;
        this.loadExplorerEvents();
        this.showToast(`Applied filter: ${field} = ${val}`);
      }

      exportExplorerCSV() {
        const events = this.state.events || [];
        if (events.length === 0) {
          this.showToast('No events available to export.');
          return;
        }

        const headers = ['TIME', 'EVENT ID', 'SOURCE', 'EVENT TYPE', 'SEVERITY', 'OCSF', 'INTEGRITY', 'SRC IP', 'DST IP', 'USER', 'MESSAGE'];
        const rows = events.map(e => [
          `"${(e.timestamp || e.created_at || '').replace(/"/g, '""')}"`,
          `"${(e.event_id || '').replace(/"/g, '""')}"`,
          `"${(e.source_display || e.src_hostname || '').replace(/"/g, '""')}"`,
          `"${(e.event_type_display || e.activity_name || '').replace(/"/g, '""')}"`,
          `"${(e.severity_clean || e.severity || '').replace(/"/g, '""')}"`,
          `"${(e.ocsf_display || e.class_name || '').replace(/"/g, '""')}"`,
          `"${(e.integrity_status || (e.blockchain_proof && e.blockchain_proof.status) || 'PENDING').replace(/"/g, '""')}"`,
          `"${(e.src_ip || '').replace(/"/g, '""')}"`,
          `"${(e.dst_ip || '').replace(/"/g, '""')}"`,
          `"${(e.user || '').replace(/"/g, '""')}"`,
          `"${(e.message || e.raw_event || '').replace(/"/g, '""')}"`
        ].join(','));

        const csvContent = headers.join(',') + '\n' + rows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `ulpf_log_explorer_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        this.showToast(`✓ Exported ${events.length} events to CSV`);
      }

      shareExplorerQuery() {
        const queryParams = new URLSearchParams();
        if (this.explorerState.searchVal) queryParams.set('q', this.explorerState.searchVal);
        if (this.explorerState.sourceFilter !== 'all') queryParams.set('source', this.explorerState.sourceFilter);
        if (this.explorerState.severityFilter !== 'all') queryParams.set('severity', this.explorerState.severityFilter);
        if (this.explorerState.integrityFilter !== 'all') queryParams.set('integrity', this.explorerState.integrityFilter);
        if (this.explorerState.timeRange !== 'all') queryParams.set('time', this.explorerState.timeRange);
        if (this.explorerState.ocsfFilter !== 'all') queryParams.set('ocsf', this.explorerState.ocsfFilter);

        const shareUrl = window.location.origin + window.location.pathname + '#/explorer?' + queryParams.toString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            this.showToast('✓ Query and filter parameters copied to clipboard!');
          }).catch(() => {
            prompt('Copy query URL:', shareUrl);
          });
        } else {
          prompt('Copy query URL:', shareUrl);
        }
      }

      showToast(text) {
        const toast = document.getElementById('toast-notification');
        const toastText = document.getElementById('toast-text');
        if (!toast) return;
        if (toastText) toastText.innerText = text;
        toast.style.opacity = '1';
        toast.style.pointerEvents = 'auto';
        toast.style.transform = 'translateY(0)';
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.pointerEvents = 'none';
          toast.style.transform = 'translateY(8px)';
        }, 3500);
      }

      closeIntegrityModal() {
        const modal = document.getElementById('integrity-modal');
        if (modal) modal.classList.remove('active');
      }

      renderView() {
        const root = document.getElementById('app-root');
        switch (this.currentPage) {
          case 'ingestion':
          case 'converter':
            root.innerHTML = `<div class="p-stack-lg">${renderIngestionPage(this.ingestionState)}</div>`;
            break;
          case 'dashboard':
            root.innerHTML = renderDashboardPage(this.dashboardState);
            break;
          case 'sources':
            root.innerHTML = renderSourcesPage(this.sourcesState);
            break;
          case 'explorer':
            root.innerHTML = renderLogExplorerPage(
              this.state.events,
              this.state.totalEvents,
              this.explorerState.page,
              this.explorerState.pageSize,
              this.explorerState
            );
            break;

          case 'blockchain':
            root.innerHTML = renderBlockchainPage(this.blockchainState);
            break;
          case 'analytics':
            root.innerHTML = renderAnalyticsPage(this.analyticsState);
            break;
          case 'investigation':
            root.innerHTML = renderInvestigationPage(this.investigationState);
            break;
          case 'onboarding':
            root.innerHTML = `<div class="p-6">${renderSourceOnboardingPage(this.state.sources, this.lastBatchResult)}</div>`;
            break;
          case 'ai-intelligence':

      // ── Ingestion Console Methods ──────────────────────────────────────────
      async loadIngestionData() {
        this.ingestionState.loading = true;
        try {
          const [ovRes, jobsRes] = await Promise.all([
            fetch('/api/ingest/overview'),
            fetch('/api/ingest/jobs')
          ]);
          if (ovRes.ok) this.ingestionState.overview = await ovRes.json();
          if (jobsRes.ok) {
            const data = await jobsRes.json();
            this.ingestionState.jobs = data.jobs || [];
            if (!this.ingestionState.selectedJobId && this.ingestionState.jobs.length > 0) {
              this.ingestionState.selectedJobId = this.ingestionState.jobs[0].job_id;
            }
          }
        } catch (e) {
          console.error("Failed to load ingestion data", e);
          this.ingestionState.error = e.message;
        } finally {
          this.ingestionState.loading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            this.renderView();
            this.scrollFeedToBottom();
          }
        }
      }

      selectJob(jobId) {
        this.ingestionState.selectedJobId = jobId;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
          this.scrollFeedToBottom();
        }
      }

      toggleFeedPause() {
        this.ingestionState.isPaused = !this.ingestionState.isPaused;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }
      }

      clearFeed() {
        const selectedJob = this.ingestionState.jobs.find(j => j.job_id === this.ingestionState.selectedJobId);
        if (selectedJob) {
          selectedJob.logs = [];
        }
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }
      }

      scrollFeedToBottom() {
        setTimeout(() => {
          const feed = document.getElementById('live-log-feed');
          if (feed && !this.ingestionState.isPaused) {
            feed.scrollTop = feed.scrollHeight;
          }
        }, 50);
      }

      handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        const dz = document.getElementById('drop-zone');
        if (dz) {
          dz.classList.add('border-primary', 'bg-primary-container/20');
        }
      }

      handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        const dz = document.getElementById('drop-zone');
        if (dz) {
          dz.classList.remove('border-primary', 'bg-primary-container/20');
        }
      }

      handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        this.handleDragLeave(e);
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          this.handleFilesUpload(e.dataTransfer.files);
        }
      }

      handleFileInputChange(e) {
        if (e.target && e.target.files && e.target.files.length > 0) {
          this.handleFilesUpload(e.target.files);
        }
      }

      async handleFilesUpload(fileList) {
        if (!fileList || fileList.length === 0) return;
        this.ingestionState.isUploading = true;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }

        const formData = new FormData();
        for (let i = 0; i < fileList.length; i++) {
          formData.append('files', fileList[i]);
        }

        try {
          const res = await fetch('/api/ingest/upload', {
            method: 'POST',
            body: formData
          });
          const result = await res.json();
          await this.loadIngestionData();
          if (result && result.job) {
            this.ingestionState.selectedJobId = result.job.job_id;
          }
        } catch (err) {
          console.error("Upload error:", err);
          alert("Ingestion error: " + err.message);
        } finally {
          this.ingestionState.isUploading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            this.renderView();
            this.scrollFeedToBottom();
          }
        }
      }

      downloadJSON(obj, filename = 'normalized_result.json') {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

      exportExplorerJSON() {
        const params = new URLSearchParams();
        if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
          params.set('format', this.explorerState.formatFilter);
        }
        if (this.explorerState.searchVal) {
          params.set('search', this.explorerState.searchVal);
        }
        params.set('order_by', this.explorerState.sortOrder || 'created_at');
        params.set('direction', 'desc');
        window.location.href = `/export/json?${params.toString()}`;
      }

      exportExplorerParquet() {
        window.location.href = `/export/parquet`;
      }

      downloadLastBatchJSON() {
        if (!this.lastBatchResult || !this.lastBatchResult.processed_events) {
          alert('No recent batch found to download.');
          return;
        }
        const events = this.lastBatchResult.processed_events.map(item => item.normalized_event);
        const rawName = (this.lastBatchResult.file_name || 'batch_events').replace(/\.[^/.]+$/, "");
        const fileName = `${rawName}_normalized.json`;
        this.downloadJSON(events, fileName);
      }

      async handleSingleFileConvert() {
        const fileInput = document.getElementById('converter-file-input');
        const textInput = document.getElementById('converter-text-input');
        const statusBox = document.getElementById('converter-status');
        const previewBox = document.getElementById('converter-preview');
        const copyBtn = document.getElementById('copy-json-btn');
        const btn = document.getElementById('converter-btn');

        const formData = new FormData();
        let label = 'direct_snippet.json';
        if (fileInput?.files?.length > 0) {
          formData.append('file', fileInput.files[0]);
          label = fileInput.files[0].name.replace(/\.[^/.]+$/, "") + "_normalized.json";
        } else if (textInput?.value?.trim()) {
          formData.append('raw_text', textInput.value.trim());
          label = 'single_snippet_normalized.json';
        } else {
          alert('Please enter or select a log file/snippet first.');
          return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Converting...';
        statusBox.className = 'upload-status loading';
        statusBox.innerText = 'Converting single file to normalized JSON...';

        try {
          const res = await fetch('/convert', { method: 'POST', body: formData });
          if (!res.ok) throw new Error(await res.text());
          const jsonText = await res.text();
          const parsedData = JSON.parse(jsonText);
          this.lastConvertedJSON = parsedData;

          previewBox.innerText = JSON.stringify(parsedData, null, 2);
          if (copyBtn) copyBtn.style.display = 'inline-flex';

          statusBox.className = 'upload-status success';
          statusBox.innerHTML = `
            <div style="font-weight:600; margin-bottom:4px;">✅ Converted ${parsedData.length} event(s) successfully!</div>
            <div style="font-size:11px; margin-bottom:8px;">Only your single file/snippet was processed.</div>
            <button class="btn btn-sm btn-success" onclick="app.downloadJSON(app.lastConvertedJSON, '${label}')">📥 Download ${label}</button>
          `;

          // Automatically trigger download
          this.downloadJSON(parsedData, label);
        } catch (err) {
          statusBox.className = 'upload-status error';
          statusBox.innerText = '❌ Error converting: ' + err.message;
        } finally {
          btn.disabled = false;
          btn.innerText = '⚡ Convert & Download JSON';
        }
      }

      copyConverterJSON() {
        if (this.lastConvertedJSON) {
          navigator.clipboard.writeText(JSON.stringify(this.lastConvertedJSON, null, 2));
          alert('Copied normalized JSON to clipboard!');
        }
      }

      downloadCurrentModalEvent() {
        if (this.currentModalEvent) {
          this.downloadJSON(this.currentModalEvent, `event_${this.currentModalEvent.event_id || 'normalized'}.json`);
        }
      }

      async inspectEvent(eventId) {
        try {
          let data = null;
          let rawText = '';

          try {
            const res = await fetch('/events/' + eventId);
            if (res.ok) {
              data = await res.json();
              rawText = data.raw_text || data.raw_event || 'No raw text attached';
            }
          } catch (e) {
            // offline mode
          }

          if (!data) {
            const allEvts = (this.state.events || []).concat(OFFLINE_EXPLORER_DATASET);
            data = allEvts.find(e => e.event_id === eventId);
            if (!data) throw new Error('Event not found: ' + eventId);
            rawText = data.raw_event || data.raw_text || data.message || 'No raw text attached';
          }

          this.currentModalEvent = Object.assign({}, data);
          const ocsfCopy = Object.assign({}, data);
          delete ocsfCopy.raw_text;
          delete ocsfCopy.raw_event;
          delete ocsfCopy.raw_received_at;
          delete ocsfCopy.source_file;

          const idBadge = document.getElementById('modal-event-id-badge');
          if (idBadge) idBadge.innerText = data.event_id || 'EVT-UNKNOWN';

          const timeEl = document.getElementById('modal-meta-time');
          if (timeEl) timeEl.innerText = data.timestamp || data.created_at || '—';

          const srcEl = document.getElementById('modal-meta-source');
          if (srcEl) srcEl.innerText = (data.source_display || data.src_hostname || 'unknown-source') + (data.src_ip ? ` (${data.src_ip})` : '');

          const ocsfEl = document.getElementById('modal-meta-ocsf');
          if (ocsfEl) {
            ocsfEl.innerHTML = `${renderSeverityBadge(data.severity_clean || data.severity)} <span class="text-on-surface-variant font-medium">${escapeHtml(data.ocsf_display || data.class_name || 'Security Finding')}</span>`;
          }

          const integEl = document.getElementById('modal-meta-integrity');
          if (integEl) {
            integEl.innerHTML = renderIntegrityBadge(data.integrity_status || (data.blockchain_proof && data.blockchain_proof.status));
          }

          const normEl = document.getElementById('modal-normalized-json');
          if (normEl) normEl.innerText = JSON.stringify(ocsfCopy, null, 2);

          const rawEl = document.getElementById('modal-raw-text');
          if (rawEl) rawEl.innerText = rawText;

          const badge = document.getElementById('modal-integrity-badge');
          const details = document.getElementById('modal-integrity-details');
          if (badge) {
            badge.className = 'px-2 py-0.5 rounded font-code-xs text-[10px] font-bold bg-primary/15 text-primary border border-primary/30';
            badge.innerText = 'VERIFYING...';
          }
          if (details) {
            details.innerText = "Comparing computed SHA-256 with immutable blockchain ledger proof...";
          }

          document.getElementById('trace-modal').classList.add('active');
          this.verifyCurrentModalEventIntegrity();
        } catch (err) {
          alert('Traceability error: ' + err.message);
        }
      }

      closeModal() {
        document.getElementById('trace-modal').classList.remove('active');
      }

      async loadBlockchainData() {
        this.blockchainState.loading = true;

        // If on file: protocol or no server, load from offline pre-compiled batch dataset
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
          if (window.OFFLINE_BLOCKCHAIN_SUMMARY) {
            this.blockchainState.summary = window.OFFLINE_BLOCKCHAIN_SUMMARY;
          }
          if (window.OFFLINE_BLOCKCHAIN_BATCHES && window.OFFLINE_BLOCKCHAIN_BATCHES.length > 0) {
            this.blockchainState.blocks = JSON.parse(JSON.stringify(window.OFFLINE_BLOCKCHAIN_BATCHES));
            if (!this.blockchainState.selectedBlock) {
              this.blockchainState.selectedBlock = this.blockchainState.blocks[0];
              this.blockchainState.selectedBlockId = this.blockchainState.blocks[0].block_index;
            }
          }
          this.blockchainState.loading = false;
          if (this.currentPage === 'blockchain') {
            this.renderView();
          }
          return;
        }

        try {
          const [sumRes, blkRes] = await Promise.all([
            fetch('/api/blockchain/summary'),
            fetch('/api/blockchain/blocks?limit=100&offset=0')
          ]);
          if (sumRes.ok) this.blockchainState.summary = await sumRes.json();
          if (blkRes.ok) {
            this.blockchainState.blocks = await blkRes.json();
            if (!this.blockchainState.selectedBlock && this.blockchainState.blocks.length > 0) {
              this.blockchainState.selectedBlock = this.blockchainState.blocks[0];
              this.blockchainState.selectedBlockId = this.blockchainState.blocks[0].block_index;
            } else if (this.blockchainState.selectedBlockId !== null) {

      async verifySelectedBlock() {
        if (!this.blockchainState.selectedBlock) return;
        const block = this.blockchainState.selectedBlock;

        // Check if offline/file protocol
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
          if (block.batch_hash === block.anchor_hash) {
            block.status = 'VERIFIED';
            block.verification_reason = 'Cryptographically sealed and verified against ledger anchor.';
          } else {
            block.status = 'FAILED';
            block.verification_reason = 'HASH MISMATCH: Local stored hash does not match immutable ledger anchor hash.';
          }
          if (this.currentPage === 'blockchain') this.renderView();
          return;
        }

        try {
          const res = await fetch(`/api/blockchain/blocks/${block.block_index}/verify`);
          if (res.ok) {
            const result = await res.json();
            block.status = result.status;
            block.verification_reason = result.message;
            // Update in list
            const idx = this.blockchainState.blocks.findIndex(b => b.block_index === block.block_index);
            if (idx !== -1) {
              this.blockchainState.blocks[idx] = { ...this.blockchainState.blocks[idx], ...block };
            }
            // Refresh summary metrics
            const sumRes = await fetch('/api/blockchain/summary');
            if (sumRes.ok) this.blockchainState.summary = await sumRes.json();
            if (this.currentPage === 'blockchain') this.renderView();
          } else {
            throw new Error(await res.text());
          }
        } catch (err) {
          alert('Block verification error: ' + err.message);
        }
      }

        const details = document.getElementById('modal-integrity-details');

        try {
          let data = null;
          try {
            const res = await fetch(`/api/blockchain/integrity/${eventId}`);
            if (res.ok) {
              data = await res.json();
            }
          } catch (e) {
            // offline mode
          }

          if (!data) {
            const proof = this.currentModalEvent.blockchain_proof || {};
            const isTampered = proof.status === 'FAILED' || String(proof.event_hash || '').startsWith('TAMPERED');
            data = {
              status: isTampered ? 'FAILED' : (proof.status || 'VERIFIED'),
              event_id: eventId,
              block_index: proof.block_index !== undefined ? proof.block_index : 36879,
              action: this.currentModalEvent.action || 'INGEST_LOG',
              timestamp: proof.timestamp || this.currentModalEvent.timestamp || '2026-09-03 21:58:13Z',
              stored_hash: proof.event_hash || '9f83c12a884e912b73a5a7b05f23bcde9812401f8012b18420956bc109fbc812',
              blockchain_hash: proof.expected_hash || proof.event_hash || '9f83c12a884e912b73a5a7b05f23bcde9812401f8012b18420956bc109fbc812',
              message: isTampered ? 'Hash mismatch! Stored data differs from blockchain anchor.' : 'Cryptographic SHA-256 matches blockchain ledger proof exactly.'
            };
          }

          if (data.status === 'VERIFIED') {
            if (badge) {
              badge.className = 'px-2 py-0.5 rounded font-code-xs text-[10px] font-bold bg-[#10b981]/15 text-[#86efac] border border-[#10b981]/40';
              badge.innerText = '✓ CRYPTOGRAPHICALLY VERIFIED';
            }
            if (details) {
              details.innerHTML = `
                <div class="col-span-1 md:col-span-2 text-[#86efac] font-bold mb-1">✅ ${data.message}</div>
                <div><span class="text-outline">Block Index:</span> #${data.block_index}</div>
                <div><span class="text-outline">Ledger Timestamp:</span> ${data.timestamp || '—'}</div>
                <div class="col-span-1 md:col-span-2"><span class="text-outline">Event SHA-256:</span> <span class="font-mono text-primary text-[11px]">${data.stored_hash}</span></div>
                <div class="col-span-1 md:col-span-2"><span class="text-outline">Ledger Root:</span> <span class="font-mono text-[#86efac] text-[11px]">${data.blockchain_hash}</span> (MATCH)</div>
              `;
            }
          } else {
            if (badge) {
              badge.className = 'px-2 py-0.5 rounded font-code-xs text-[10px] font-bold bg-error/15 text-error border border-error/40';
              badge.innerText = '🔴 TAMPER DETECTED';
            }
            if (details) {
              details.innerHTML = `
                <div class="col-span-1 md:col-span-2 text-error font-bold mb-1">🚨 ${data.message}</div>
                <div><span class="text-outline">Block Index:</span> #${data.block_index || '—'}</div>
                <div class="col-span-1 md:col-span-2"><span class="text-outline">Calculated Stored SHA-256:</span> <span class="font-mono text-error text-[11px]">${data.stored_hash || 'ALTERED'}</span></div>
                <div class="col-span-1 md:col-span-2"><span class="text-outline">Original Blockchain Anchor:</span> <span class="font-mono text-[#86efac] text-[11px]">${data.blockchain_hash || 'UNKNOWN'}</span> (MISMATCH)</div>
              `;
            }
          }
        } catch (err) {

        }

      async simulateCurrentModalEventTamper() {
        if (!this.currentModalEvent || !this.currentModalEvent.event_id) {
          alert('No event currently loaded.');
          return;
        }
        const eventId = this.currentModalEvent.event_id;
        try {
          const res = await fetch(`/api/blockchain/simulate-tamper/${eventId}`, { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            alert(`⚠️ TAMPERING SIMULATED FOR TEST/DEMO:\n\n${data.message}\n\nNow running integrity verification...`);
            await this.verifyCurrentModalEventIntegrity();
            return;
          }
        } catch (err) {
          // offline simulation
        }

        if (!this.currentModalEvent.blockchain_proof) {
          this.currentModalEvent.blockchain_proof = {};
        }
        this._originalOfflineEvent = JSON.parse(JSON.stringify(this.currentModalEvent));
        this.currentModalEvent.blockchain_proof.status = 'FAILED';
        this.currentModalEvent.blockchain_proof.expected_hash = this.currentModalEvent.blockchain_proof.event_hash || '9f83c12a884e912b73a5a7b05f23bcde9812401f8012b18420956bc109fbc812';
        this.currentModalEvent.blockchain_proof.event_hash = 'TAMPERED_' + Math.random().toString(16).slice(2) + 'badhash';
        alert('⚠️ TAMPERING SIMULATED (Offline Demo Mode):\n\nLog payload was altered in memory. Expected hash and calculated hash now differ.\n\nRunning cryptographic integrity verification...');
        this.verifyCurrentModalEventIntegrity();
      }

      async restoreCurrentModalEvent() {
        if (!this.currentModalEvent || !this.currentModalEvent.event_id) {
          alert('No event currently loaded.');
          return;
        }
        const eventId = this.currentModalEvent.event_id;
        try {
          const res = await fetch(`/api/blockchain/restore/${eventId}`, { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            alert(`↺ EVIDENCE RESTORED:\n\n${data.message}\n\nRe-running cryptographic verification...`);
            const evRes = await fetch(`/events/${eventId}`);
            if (evRes.ok) {
              const evData = await evRes.json();
              const rawText = evData.raw_text || evData.raw_event || '';
              const rawEl = document.getElementById('modal-raw-text');
              if (rawEl && rawText) rawEl.innerText = rawText;
            }
            await this.verifyCurrentModalEventIntegrity();
            return;
          }
        } catch (err) {
          // offline restore
        }

        if (this._originalOfflineEvent) {
          this.currentModalEvent = JSON.parse(JSON.stringify(this._originalOfflineEvent));
        } else if (this.currentModalEvent.blockchain_proof) {
          this.currentModalEvent.blockchain_proof.status = 'VERIFIED';
          this.currentModalEvent.blockchain_proof.event_hash = this.currentModalEvent.blockchain_proof.expected_hash || '9f83c12a884e912b73a5a7b05f23bcde9812401f8012b18420956bc109fbc812';
        }
        alert('↺ EVIDENCE RESTORED (Offline Demo Mode):\n\nReverted tampering back to authentic evidence. Recalculating hash...');
        this.verifyCurrentModalEventIntegrity();
      }


      async handleUpload() {
        const fileInput = document.getElementById('log-file-input');
        const textInput = document.getElementById('raw-log-input');
        const statusBox = document.getElementById('upload-status');
        const btn = document.getElementById('ingest-btn');

        const formData = new FormData();
        let label = '';
        if (fileInput?.files?.length > 0) {
          formData.append('file', fileInput.files[0]);
          label = fileInput.files[0].name;
        } else if (textInput?.value?.trim()) {
          formData.append('raw_text', textInput.value.trim());
          label = 'Direct Text';
        } else {
          alert('Please choose a file or enter log text.');
          return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Ingesting...';
        statusBox.className = 'upload-status loading';
        statusBox.innerText = `Ingesting ${label}...`;

        try {
          const res = await fetch('/upload', { method: 'POST', body: formData });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();

          this.lastBatchResult = data;
          this.renderView();

          // Also refresh general stats in background
          const statsRes = await fetch('/stats');
          if (statsRes.ok) this.state.stats = await statsRes.json();
        } catch (err) {
          statusBox.className = 'upload-status error';
          statusBox.innerText = '❌ Error: ' + err.message;
        } finally {
          const curBtn = document.getElementById('ingest-btn');
          if (curBtn) {
            curBtn.disabled = false;
            curBtn.innerText = '🚀 Ingest into Database';
          }
        }
      }

        this.renderView();
      }

      closeAiModal() {
        this.aiState.activeModal = null;
        this.renderView();
      }

      async submitUploadedSample() {
        const sourceInput = document.getElementById('ai-upload-source');
        const textInput = document.getElementById('ai-upload-text');
        const source = (sourceInput && sourceInput.value.trim()) || 'custom-sample';
        const text = (textInput && textInput.value.trim()) || '';

        if (!text) {
          alert('Please paste or enter raw log lines.');
          return;
        }

        this.closeAiModal();
        this.aiState.isAnalyzing = true;
        this.renderView();

        try {
          const res = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw_log: text, source: source }),
          });

          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();

          const customId = `uploaded-${Date.now()}`;
          this.aiState.unknownLogs.unshift({
            id: customId,
            source: source,
            first_seen: new Date().toISOString(),
            format_guess: data.format_name,
            status: 'pending',
            sibling_count: 1,
            raw_log: text,
            lines_count: text.split('\n').length,
            analysis: data
          });

          this.aiState.selectedLogId = customId;
          this.aiState.currentAnalysis = data;
          this.aiState.validationResult = data.validation_result;
          this.aiState.activeTab = 'unknown-logs';
        } catch (err) {
          alert('Failed to analyze sample: ' + err.message);
        } finally {
          this.aiState.isAnalyzing = false;
          this.renderView();
        }
      }

      saveEditedTemplate() {
        const input = document.getElementById('ai-edit-template-input');
        if (input && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.inferred_template = input.value.trim();
        }
        this.closeAiModal();
        this.validateCurrentParser();
      }

      saveModifiedRule() {
        const nameInput = document.getElementById('ai-modify-format-name');
        const yamlInput = document.getElementById('ai-modify-yaml-input');

        if (nameInput && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.format_name = nameInput.value.trim();
        }
        if (yamlInput && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.suggested_parser_yaml = yamlInput.value;
        }

        this.closeAiModal();
        this.validateCurrentParser();
      }

      async confirmRejectParser() {
        const reasonInput = document.getElementById('ai-reject-reason');
        const reason = (reasonInput && reasonInput.value.trim()) || 'Manual analyst rejection';

        this.closeAiModal();
        try {
          const res = await fetch('/api/ai/reject-parser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              log_id: this.aiState.selectedLogId,
              reason: reason,
              rejected_by: 'security_analyst'
            }),
          });

          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          alert(`✓ Suggestion archived: ${data.message}`);

          // Reload data
          await this.loadAiWorkbenchData();
        } catch (err) {
          alert('Failed to reject: ' + err.message);
        }
      }

      async runAiBatchAnalysis() {
        try {
          const res = await fetch('/api/ai/batch-analysis', { method: 'POST' });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          alert(`✓ Batch Analysis Complete: Processed ${data.total_analyzed} unknown log formats with local offline AI.`);
          await this.loadAiWorkbenchData();
        } catch (err) {
          alert('Batch analysis failed: ' + err.message);
        }
      }

      // ── Analytics Methods ──────────────────────────────────────────────────
      async loadAnalyticsData(range = null) {
        if (range) {
          this.analyticsState.timeRange = range;
        }
        const currentRange = (this.analyticsState.timeRange || '7D').toLowerCase();
        this.analyticsState.loading = true;

        // Check if offline/file protocol or no server
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
          if (window.OFFLINE_ANALYTICS_DATA) {
            this.analyticsState.summary = window.OFFLINE_ANALYTICS_DATA.summary;
            this.analyticsState.volume = window.OFFLINE_ANALYTICS_DATA.volume;
            this.analyticsState.severity = window.OFFLINE_ANALYTICS_DATA.severity;
            this.analyticsState.ocsf = window.OFFLINE_ANALYTICS_DATA.ocsf;
            this.analyticsState.parsing = window.OFFLINE_ANALYTICS_DATA.parsing;
          }
          this.analyticsState.loading = false;
          if (this.currentPage === 'analytics') {
            this.renderView();
          }
          return;
        }

        try {
          const [sumRes, volRes, sevRes, ocsfRes, parsRes] = await Promise.all([
            fetch('/api/analytics/summary'),
            fetch(`/api/analytics/event-volume?range=${currentRange}`),
            fetch(`/api/analytics/severity?range=${currentRange}`),
            fetch(`/api/analytics/ocsf-categories?range=${currentRange}`),
            fetch(`/api/analytics/parsing-comparison?range=${currentRange === '1h' || currentRange === '24h' ? '7d' : currentRange}`)
          ]);

          if (sumRes.ok) this.analyticsState.summary = await sumRes.json();
          if (volRes.ok) this.analyticsState.volume = await volRes.json();
          if (sevRes.ok) this.analyticsState.severity = await sevRes.json();
          if (ocsfRes.ok) this.analyticsState.ocsf = await ocsfRes.json();
          if (parsRes.ok) this.analyticsState.parsing = await parsRes.json();

          this.analyticsState.error = null;
        } catch (err) {
          console.warn('Backend analytics query failed, falling back to local dataset:', err);
          if (window.OFFLINE_ANALYTICS_DATA) {
            this.analyticsState.summary = window.OFFLINE_ANALYTICS_DATA.summary;
            this.analyticsState.volume = window.OFFLINE_ANALYTICS_DATA.volume;
            this.analyticsState.severity = window.OFFLINE_ANALYTICS_DATA.severity;
            this.analyticsState.ocsf = window.OFFLINE_ANALYTICS_DATA.ocsf;
            this.analyticsState.parsing = window.OFFLINE_ANALYTICS_DATA.parsing;
          }
        } finally {
          this.analyticsState.loading = false;
          if (this.currentPage === 'analytics') {
            this.renderView();
          }
        }
      }

      setAnalyticsTimeRange(range) {
        this.analyticsState.timeRange = range;
        this.loadAnalyticsData(range);
      }

      filterExplorerByCategory(catParam) {
        this.explorerState.categoryFilter = catParam;
        if (catParam.includes('network')) this.explorerState.ocsfFilter = 'Network Activity';
        else if (catParam.includes('system')) this.explorerState.ocsfFilter = 'System Activity';
        else if (catParam.includes('auth') || catParam.includes('ident')) this.explorerState.ocsfFilter = 'Authentication';
        else if (catParam.includes('app')) this.explorerState.ocsfFilter = 'Application Activity';
        else if (catParam.includes('find')) this.explorerState.ocsfFilter = 'Findings';
        this.navigate('explorer');
      }

      // ── Investigation Console Methods ──────────────────────────────────────
      async loadInvestigationEvent(eventId = null) {
        this.investigationState.loading = true;
        this.investigationState.error = null;
        if (eventId) {
          this.investigationState.eventId = eventId;
        }

        if (this.currentPage === 'investigation') {
          this.renderView();
        }

        // Check if offline/file protocol or no server
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
          if (window.OFFLINE_INVESTIGATION_EVENT) {
            this.investigationState.event = window.OFFLINE_INVESTIGATION_EVENT;
            this.investigationState.eventId = this.investigationState.event.event_id;
          }
          this.investigationState.loading = false;
          if (this.currentPage === 'investigation') {
            this.renderView();
          }
          return;
        }

        try {
          const url = this.investigationState.eventId 
            ? `/api/events/${encodeURIComponent(this.investigationState.eventId)}/investigation` 
            : '/api/events/latest/investigation';
          const res = await fetch(url);
          if (res.ok) {
            this.investigationState.event = await res.json();
            this.investigationState.eventId = this.investigationState.event.event_id;
          } else {
            // If specific event returned 404, try loading latest
            if (this.investigationState.eventId) {
              const fallback = await fetch('/api/events/latest/investigation');
              if (fallback.ok) {
                this.investigationState.event = await fallback.json();
                this.investigationState.eventId = this.investigationState.event.event_id;
              } else {
                throw new Error(`Event '${this.investigationState.eventId}' not found in DuckDB.`);
              }
            } else {
              throw new Error("Unable to load investigation event telemetry.");
            }
          }
        } catch (err) {
          console.warn("Failed to query live investigation event, falling back to offline event:", err);
          this.investigationState.error = err.message;
          if (window.OFFLINE_INVESTIGATION_EVENT) {
            this.investigationState.event = window.OFFLINE_INVESTIGATION_EVENT;
            this.investigationState.eventId = this.investigationState.event.event_id;
          }
        } finally {
          this.investigationState.loading = false;
          if (this.currentPage === 'investigation') {
            this.renderView();
          }
        }
      }

      setInvestigationTab(tab) {
        this.investigationState.activeTab = tab;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      exportCurrentEvent() {
        const evt = this.investigationState.event;
        if (!evt) return;
        const filename = `ulpf_artifact_${evt.event_id || 'event'}.json`;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(evt, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        this.showToast(`Artifact exported: ${filename}`);
      }

      openIsolateModal() {
        this.investigationState.isolateModalOpen = true;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      closeIsolateModal() {
        this.investigationState.isolateModalOpen = false;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      async confirmIsolateSource() {
        const evt = this.investigationState.event;
        const sourceName = evt ? evt.source : 'unknown-source';
        const willBeIsolated = !this.investigationState.isIsolated;
        try {
          await fetch(`/api/sources/${encodeURIComponent(sourceName)}/isolate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isolated: willBeIsolated })
          });
        } catch (e) {
          console.warn("Isolation endpoint error:", e);
        }
        this.investigationState.isIsolated = willBeIsolated;
        this.investigationState.isolateModalOpen = false;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
        this.showToast(willBeIsolated ? `Source '${sourceName}' forensically quarantined` : `Source '${sourceName}' released`);
      }

      viewEventOnLedger(blockIndex) {
        this.navigate('blockchain');
        if (blockIndex) {
          setTimeout(() => {
            if (this.selectBlock) {
              this.selectBlock(blockIndex);
            }
          }, 300);
        }
      }

      copyText(text, label = 'Item') {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            this.showToast(`${label} copied to clipboard`);
          }).catch(() => {
            this.fallbackCopyText(text, label);
          });
        } else {
          this.fallbackCopyText(text, label);
        }
      }

      fallbackCopyText(text, label) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          this.showToast(`${label} copied to clipboard`);
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
      }

      showToast(message) {
        let toast = document.getElementById('ulpf-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'ulpf-toast';
          toast.className = 'fixed bottom-5 right-5 z-[9999] bg-surface-container-highest border border-outline-variant text-on-surface px-4 py-2 rounded-DEFAULT shadow-lg font-code-xs text-code-xs flex items-center gap-2 animate-fade-in pointer-events-none';
          document.body.appendChild(toast);
        }
        toast.innerHTML = `<span class="material-symbols-outlined text-[14px] text-tertiary">check_circle</span><span>${message}</span>`;
        toast.style.display = 'flex';
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
          if (toast) toast.style.display = 'none';
        }, 2200);
      }
    }

    const app = new ULPFApp();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
