  <!-- Complete Air-Gapped / Offline Fallback CSS Styles -->
  <style>
    :root {
      --bg: #10131a;
      --card-bg: #1d2026;
      --card-border: #3f4852;
      --text: #e1e2eb;
      --text-muted: #bec7d4;
      --accent: #98cbff;
      --success: #10b981;
      --warning: #ffb77d;
      --danger: #ffb4ab;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #10131a;
      color: #e1e2eb;
      font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0e14; }
    ::-webkit-scrollbar-thumb { background: #32353c; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #454952; }

    /* Offline Utility Fallbacks */
    .bg-background { background-color: #10131a; }
    .bg-surface-container-lowest { background-color: #0b0e14; }
    .bg-surface-container-low { background-color: #191c22; }
    .bg-surface-container { background-color: #1d2026; }
    .bg-surface-container-high { background-color: #272a31; }
    .bg-surface-container-highest { background-color: #32353c; }
    .bg-primary { background-color: #98cbff; }
    .bg-secondary-container { background-color: #454952; }
    .text-primary { color: #98cbff; }
    .text-on-primary { color: #003354; }
    .text-on-surface { color: #e1e2eb; }
    .text-on-surface-variant { color: #bec7d4; }
    .text-outline { color: #88919d; }
    .text-tertiary { color: #ffb77d; }
    .text-error { color: #ffb4ab; }
    .border-outline-variant { border-color: #3f4852; }
    .border-error-container { border-color: #93000a; }
    .border-primary { border-color: #98cbff; }
    .font-code-sm { font-family: "JetBrains Mono", monospace; font-size: 12px; }
    .font-code-xs { font-family: "JetBrains Mono", monospace; font-size: 11px; }
    .font-label-caps { font-family: "Hanken Grotesk", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .font-title-sm { font-family: "Hanken Grotesk", sans-serif; font-size: 18px; font-weight: 600; }
    .font-display-lg { font-family: "Hanken Grotesk", sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }

    /* Buttons & Secondary Pages Utilities */
    button, .btn {
      background: #1d2026;
      color: #e1e2eb;
      border: 1px solid #3f4852;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    button:hover, .btn:hover { background: #272a31; border-color: #98cbff; }
    .btn-primary { background: #00629d; border-color: #00629d; color: #fff; }
    .btn-primary:hover { background: #004a77; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    .panel {
      background: #1d2026;
      border: 1px solid #3f4852;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e1e2eb;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .badge-offline {
      background: rgba(255, 183, 125, 0.15);
      color: #ffb77d;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(255, 183, 125, 0.3);

    .table-container { overflow-x: auto; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th {
      background: #0b0e14;
      color: #bec7d4;
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid #3f4852;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td { padding: 8px 10px; border-bottom: 1px solid rgba(63, 72, 82, 0.4); }
    tr:hover td { background: rgba(39, 42, 49, 0.5); }

    .sev-badge { display: inline-block; padding: 2px 6px; border-radius: 2px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .sev-critical { background: rgba(147, 0, 10, 0.25); color: #ffb4ab; border: 1px solid #93000a; }
    .sev-high { background: rgba(147, 0, 10, 0.15); color: #ffb4ab; border: 1px solid #93000a; }
    .sev-medium { background: rgba(235, 129, 4, 0.15); color: #ffb77d; border: 1px solid rgba(235, 129, 4, 0.3); }
    .sev-low { background: rgba(152, 203, 255, 0.15); color: #98cbff; border: 1px solid rgba(152, 203, 255, 0.3); }
    .sev-unknown, .sev-informational { background: rgba(63, 72, 82, 0.3); color: #bec7d4; border: 1px solid #3f4852; }
    .fmt-pill { font-family: "JetBrains Mono", monospace; font-size: 11px; background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 2px; color: #98cbff; }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      background: #0b0e14;
      border: 1px solid #3f4852;
      border-radius: 4px;
      color: #e1e2eb;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .search-input:focus { outline: none; border-color: #98cbff; }
    textarea { width: 100%; height: 140px; background: #0b0e14; border: 1px solid #3f4852; border-radius: 4px; color: #e1e2eb; padding: 10px; font-family: monospace; font-size: 12px; margin-bottom: 10px; resize: vertical; }
    .upload-status { margin-top: 8px; font-size: 12px; padding: 10px 14px; border-radius: 4px; display: none; }
    .upload-status.success { display: block; background: rgba(16, 185, 129, 0.15); color: #86efac; border: 1px solid rgba(16, 185, 129, 0.3); }
    .upload-status.error { display: block; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
    .upload-status.loading { display: block; background: rgba(152, 203, 255, 0.15); color: #98cbff; border: 1px solid rgba(152, 203, 255, 0.3); }

    pre { background: #0b0e14; border: 1px solid #3f4852; padding: 12px; border-radius: 4px; color: #98cbff; font-family: "JetBrains Mono", monospace; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    
    /* Investigation Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: #1d2026; border: 1px solid #3f4852; border-radius: 8px; max-width: 900px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }

    /* Pulse animation */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .animate-pulse-fast { animation: pulse-fast 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>

    function renderIngestionPage(state) {
      const overview = (state && state.overview) || { total_ingested: 0, total_ingested_str: '0 Events', active_jobs: 0 };
      const jobs = (state && state.jobs) || [];
      const selectedJobId = (state && state.selectedJobId) || (jobs[0] ? jobs[0].job_id : null);
      const selectedJob = jobs.find(j => j.job_id === selectedJobId) || jobs[0] || null;
      const isUploading = state && state.isUploading;
      const isPaused = state && state.isPaused;

      // Selected job lifecycle stages
      const lifecycle = (selectedJob && selectedJob.lifecycle) || {
        received: { name: 'Received', status: 'PENDING', pct: 0, label: 'Pending' },

      function getStepConfig(step, defaultIcon) {

        let bgClass = 'bg-surface-variant text-on-surface-variant opacity-60';

        } else if (st === 'ACTIVE') {

          borderClass = 'border border-error';
          icon = 'error';

        return {

          borderClass,
          icon,
          label: s.label || (st === 'COMPLETED' ? '100%' : 'Pending'),
        };
      }

      const step1 = getStepConfig(lifecycle.received, 'download');
      const step2 = getStepConfig(lifecycle.detected, 'search');
      const step3 = getStepConfig(lifecycle.parsed, 'code_blocks');
      const step4 = getStepConfig(lifecycle.normalized, 'transform');
      const step5 = getStepConfig(lifecycle.validated, 'fact_check');

                    </div>

                    <!-- Stage 5: Validated -->
                    <div class="flex flex-col items-center text-center">
                      <div class="w-12 h-12 rounded-full ${step5.bgClass} ${step5.borderClass} flex items-center justify-center mb-2 transition-all">

                    <tbody class="divide-y divide-outline-variant/40 font-code-xs">
                      ${jobs.length === 0 ? `

                        return `

                          >

                            <td class="py-3 px-4 text-right text-on-surface font-mono">${Number(j.event_count).toLocaleString()}</td>
                            <td class="py-3 px-4 text-center">
                              ${
                                j.status === 'COMPLETED' ? `
                                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-secondary-container text-on-secondary-container text-[11px] font-semibold uppercase">
                                    <span class="material-symbols-outlined text-[12px]">check</span> COMPLETED
                                  </span>
                                ` : j.status === 'AI_ROUTED' ? `
                                  <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-tertiary-container/30 text-tertiary text-[11px] font-semibold uppercase border border-tertiary/40">
                                    <span class="material-symbols-outlined text-[12px]">psychology</span> AI ROUTED

                                    <span class="material-symbols-outlined text-[12px]">error</span> FAILED

            <!-- Right Column: Live Processing Feed Panel -->

                <div class="p-stack-md border-b border-outline-variant flex items-center justify-between bg-surface-container-high">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full ${isPaused ? 'bg-outline' : 'bg-tertiary animate-pulse shadow-[0_0_8px_rgba(255,183,125,0.8)]'}"></span>

                  </div>

                      <span class="material-symbols-outlined text-[18px]">${isPaused ? 'play_arrow' : 'pause'}</span>

                  ` : logs.map(l => {

                    let rowClass = '';

                    if (sev === 'WARN') {
                      badgeClass = 'text-tertiary font-semibold';
                      rowClass = 'border-l-2 border-tertiary/60 pl-2 bg-tertiary/5 py-0.5';

                    return `

          </div>

    function renderConverterPage() {
      return renderIngestionPage(window.app ? window.app.ingestionState : null);
    }

    function formatKpiNumber(num) {
      if (num === null || num === undefined) return '0';
      const n = Number(num);
      if (isNaN(n)) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return n.toLocaleString();
    }

    function renderDashboardPage(dashboardState = {}) {
      const summary = dashboardState.summary || {};
      const volume = dashboardState.volume || { buckets: [], max_eps: 0 };
      const sources = dashboardState.sources || { distribution: [], total_events: 0 };
      const recentEvents = dashboardState.recentEvents || [];
      const loading = dashboardState.loading || false;
      const error = dashboardState.error || null;

      // Loading skeleton if no data has arrived yet
      if (loading && !summary.events_processed) {
        return `
          <div class="flex flex-col w-full p-gutter space-y-stack-md">
            <div class="grid grid-cols-6 gap-gutter">
              ${[1,2,3,4,5,6].map(() => `
                <div class="col-span-1 bg-surface-container p-4 rounded-xl border border-outline-variant h-24 animate-pulse flex flex-col justify-between">
                  <div class="h-3 w-20 bg-surface-container-highest rounded"></div>

    function renderLogExplorerPage(events = [], total = 0, page = 1, pageSize = 100, formatFilter = 'all', sortOrder = 'created_at', searchVal = '') {

        const msg = e.message ? (e.message.slice(0, 55) + (e.message.length > 55 ? '...' : '')) : (e.raw_event ? (e.raw_event.slice(0, 55) + '...') : '—');
        const vendorProd = [e.vendor, e.product].filter(Boolean).join(' / ') || '—';
        return `
          <tr>
            <td style="font-family: monospace; font-size: 11px; white-space: nowrap;">${ts}</td>
            <td>${e.category_name || '—'}</td>
            <td><span class="sev-badge ${sevClass}">${e.severity || 'UNKNOWN'}</span></td>
            <td><span class="fmt-pill">${(e.log_format || 'GENERIC').toUpperCase()}</span></td>
            <td style="font-family: monospace; font-size: 11px;">${e.src_ip || '—'}</td>
            <td style="font-size: 12px; font-weight: 500;">${e.user || '—'}</td>
            <td>${vendorProd}</td>
            <td style="font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${(e.message || e.raw_event || '').replace(/"/g, '&quot;')}">${msg}</td>
            <td><button class="btn btn-sm" onclick="app.inspectEvent('${e.event_id}')">🔍 Trace</button></td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="9" style="text-align:center; padding: 24px; color:var(--text-muted);">No matching events found. Try changing filters or ingesting logs.</td></tr>';

      return `
        <div class="panel">

    function renderSourceOnboardingPage(sources = [], lastBatch = null) {

        <tr>
          <td style="font-family: monospace; color: #38bdf8;">${s.source_name}</td>
          <td><span class="fmt-pill">${s.format.toUpperCase()}</span></td>
          <td>${s.vendor || '—'}</td>
          <td>${s.product || '—'}</td>
          <td style="font-size: 11px; color: var(--text-muted);">${s.created_at ? s.created_at.slice(0, 19) : '—'}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No custom sources registered yet.</td></tr>';

      let lastBatchBanner = '';

        const previewRows = (lastBatch.events || []).slice(0, 5).map(item => {
          const ev = item.normalized_event || {};
          return `
            <tr>
              <td style="font-family:monospace; font-size:11px;">${ev.timestamp ? String(ev.timestamp).slice(0, 19) : '—'}</td>
              <td><span class="fmt-pill">${(item.detected_format || 'GENERIC').toUpperCase()}</span></td>
              <td>${ev.category_name || '—'}</td>
              <td style="font-size:11px;">${ev.message ? ev.message.slice(0, 45) + '...' : (ev.raw_event ? ev.raw_event.slice(0, 45) + '...' : '—')}</td>
              <td><button class="btn btn-sm" onclick="app.inspectEvent('${item.event_id}')">🔍 View</button></td>
            </tr>
          `;
        }).join('');

        lastBatchBanner = `
          <div class="panel" style="border-left: 4px solid var(--success); background: rgba(16, 185, 129, 0.05); margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
              <div>
                <div style="font-size:15px; font-weight:700; color:var(--success);">✅ Batch Successfully Ingested into Database!</div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                  Ingested <strong>${lastBatch.event_count} events</strong> from <code>${lastBatch.file_name}</code> (Detected Format: <span class="fmt-pill">${lastBatch.detected_format.toUpperCase()}</span>)
                </div>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn btn-success" onclick="app.downloadLastBatchJSON()">
                  📥 Download Ingested JSON (${lastBatch.event_count} events)
                </button>
                <button class="btn btn-primary" onclick="app.jumpToLogExplorer('${lastBatch.detected_format}')">
                  🔍 Open in Log Explorer ➔
                </button>
              </div>
            </div>
            ${previewRows ? `
              <div style="margin-top:12px;">
                <div style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;">Sample Ingested Records Preview:</div>
                <div class="table-container">
                  <table>
                    <thead><tr><th>Timestamp</th><th>Format</th><th>Category</th><th>Message Preview</th><th>Action</th></tr></thead>
                    <tbody>${previewRows}</tbody>
                  </table>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        ${lastBatchBanner}

        <div class="grid-2">
          <div class="panel">
            <div class="panel-title"><span>⚡ Batch Log Ingestion & DB Storage</span></div>
            <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Ingest log batches directly into DuckDB database for instant querying in Log Explorer & Analytics:</p>
            <textarea id="raw-log-input" placeholder='Paste multi-line log batch here (Syslog, Android, JSON, CEF, XML, CSV, etc.)...'></textarea>
            <div style="margin-bottom:12px;">
              <input type="file" id="log-file-input" style="font-size:12px; color:var(--text-muted);">
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
              <button id="ingest-btn" class="btn btn-primary" onclick="app.handleUpload()">🚀 Ingest into Database</button>
              <button class="btn btn-sm" onclick="app.navigate('explorer')">🔍 Go to Log Explorer</button>
            </div>
            <div id="upload-status" class="upload-status"></div>
          </div>

          <div class="panel">
            <div class="panel-title"><span>Register Custom Log Source</span></div>
            <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
              <input type="text" id="new-src-name" class="search-input" style="margin:0;" placeholder="Source Name (e.g. corp-firewall-01)">
              <select id="new-src-format" class="search-input" style="margin:0;">
                <option value="syslog">Syslog (RFC 3164/5424)</option>
                <option value="android">Android Logcat</option>
                <option value="json">JSON</option>
                <option value="cef">CEF (Common Event Format)</option>
                <option value="leef">LEEF (Log Event Extended Format)</option>
                <option value="xml">XML / Windows EventLog</option>
                <option value="csv">CSV</option>
                <option value="generic">Generic Unstructured Text</option>
              </select>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="new-src-vendor" class="search-input" style="margin:0;" placeholder="Vendor (e.g. Cisco)">
                <input type="text" id="new-src-product" class="search-input" style="margin:0;" placeholder="Product (e.g. ASA)">

              <button class="btn" onclick="app.registerSource()">Save Source</button>

        </div>

        <div class="panel">
          <div class="panel-title"><span>Registered Source Catalog</span></div>
          <div class="table-container">
            <table>
              <thead><tr><th>Source Name</th><th>Format</th><th>Vendor</th><th>Product</th><th>Registered At</th></tr></thead>

            </table>
          </div>
        </div>
      `;

    function renderSourcesPage(sourcesState = {}) {
      const overview = sourcesState.overview || {
        active_streams: 0,
        total_events_per_sec: 0,
        total_events_per_sec_str: '0',
        dropped_or_malformed: 0,
        pipeline_sources: []
      };
      const allSources = sourcesState.sources || [];
      const categoryCounts = sourcesState.categoryCounts || { ALL: allSources.length, WINDOWS: 0, LINUX: 0, FIREWALL: 0, ENDPOINT: 0 };
      const activeCategory = sourcesState.activeCategory || 'ALL';
      const isInspectorOpen = sourcesState.isInspectorOpen !== false;
      const loading = sourcesState.loading || false;
      const error = sourcesState.error || null;

      // Filter sources based on active category
      const filteredSources = (activeCategory && activeCategory !== 'ALL')
        ? allSources.filter(s => (s.category || '').toUpperCase() === activeCategory)
        : allSources;

      // Determine selected source
      let selectedSource = null;
      if (sourcesState.selectedSourceId) {
        selectedSource = allSources.find(s => s.source_id === sourcesState.selectedSourceId);
      }
      if (!selectedSource && filteredSources.length > 0) {
        selectedSource = filteredSources[0];
      }

      // Skeleton loading state
      if (loading && allSources.length === 0) {
        return `
          <div class="flex flex-col w-full h-full min-h-[calc(100vh-3.5rem)] p-container-padding space-y-stack-lg">
            <div class="flex justify-between items-end">
              <div class="space-y-2">
                <div class="h-8 w-64 bg-surface-container rounded animate-pulse"></div>
                <div class="h-4 w-96 bg-surface-container rounded animate-pulse"></div>
              </div>
              <div class="flex gap-4">
                <div class="h-16 w-32 bg-surface-container rounded-lg animate-pulse"></div>
                <div class="h-16 w-32 bg-surface-container rounded-lg animate-pulse"></div>
              </div>
            </div>
            <div class="h-48 bg-surface-container rounded-xl animate-pulse"></div>
            <div class="h-64 bg-surface-container rounded-xl animate-pulse"></div>
          </div>
        `;
      }

      // Ingestion Pipeline top 3 source nodes
      const pipelineNodes = overview.pipeline_sources && overview.pipeline_sources.length > 0
        ? overview.pipeline_sources
        : [
            { source_id: "WIN_EVENTS", node_name: "WIN_EVENTS", type: "Windows Event Log", rate_label: "12K E/S", icon: "desktop_windows" },
            { source_id: "LINUX_SYSLOG", node_name: "LINUX_SYSLOG", type: "Linux Syslog", rate_label: "8K E/S", icon: "terminal" },
            { source_id: "FW_TRAFFIC", node_name: "FW_TRAFFIC", type: "Palo Alto / Cisco", rate_label: "22K E/S", icon: "security" },
          ];

      const pipelineNodesHtml = pipelineNodes.map(node => `
        <div onclick="app.selectSource('${node.source_id}')" class="flex items-center gap-3 p-3 bg-surface-container-high rounded-md hover:bg-surface-container-highest transition-colors cursor-pointer border border-outline-variant group">
          <span class="material-symbols-outlined text-on-surface text-[20px] group-hover:text-primary transition-colors">${node.icon || 'dns'}</span>
          <span class="font-code-xs text-code-xs text-on-surface">${escapeHtml(node.node_name)}</span>
          <span class="ml-auto font-label-caps text-label-caps text-primary bg-primary/10 px-2 py-0.5 rounded border border-primary/20">${escapeHtml(node.rate_label)}</span>
        </div>
      `).join('');

      // Source Table Rows
      const tableRowsHtml = filteredSources.length > 0 ? filteredSources.map(s => {
        const isSelected = selectedSource && selectedSource.source_id === s.source_id;
        
        let statusBadge = '';
        if (s.status === 'ONLINE') {
          statusBadge = `
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-primary/10 text-primary font-label-caps text-label-caps border border-primary/20">
              <span class="w-1.5 h-1.5 rounded-full bg-primary"></span> ONLINE
            </span>
          `;
        } else if (s.status === 'DEGRADED') {
          statusBadge = `
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-tertiary-container/20 text-tertiary font-label-caps text-label-caps border border-tertiary/40">
              <span class="w-1.5 h-1.5 rounded-full bg-tertiary animate-pulse"></span> DEGRADED
            </span>
          `;
        } else {
          statusBadge = `
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-surface-container-highest text-on-surface-variant font-label-caps text-label-caps border border-outline-variant">
              <span class="w-1.5 h-1.5 rounded-full bg-outline"></span> OFFLINE
            </span>
          `;
        }

        const anomalyPill = (s.anomalies && s.anomalies > 0)
          ? `<span class="inline-flex items-center justify-center px-2 py-0.5 rounded bg-tertiary-container/30 text-tertiary font-bold text-code-xs border border-tertiary/50 ${s.anomalies > 10 ? 'animate-pulse' : ''}">${s.anomalies}</span>`
          : `<span class="text-on-surface-variant opacity-50">${s.status === 'OFFLINE' ? '-' : '0'}</span>`;

        let icon = 'dns';
        if (s.category === 'FIREWALL') icon = 'security';
        else if (s.category === 'WINDOWS') icon = 'desktop_windows';
        else if (s.category === 'LINUX') icon = 'terminal';
        else if ((s.source_id || '').toLowerCase().includes('android')) icon = 'smartphone';
        else if ((s.source_id || '').toLowerCase().includes('mac')) icon = 'laptop_mac';
        else if ((s.source_id || '').toLowerCase().includes('router') || (s.source_id || '').toLowerCase().includes('wifi')) icon = 'router';

        return `
          <tr onclick="app.selectSource('${s.source_id}')" class="${isSelected ? 'bg-primary/10 border-b border-primary/30 hover:bg-surface-container-high' : 'bg-surface-container-lowest border-b border-outline-variant hover:bg-surface-container-high'} cursor-pointer transition-colors group ${s.status === 'OFFLINE' ? 'opacity-60' : ''}">
            <td class="p-3 text-center">
              ${isSelected ? '<div class="w-2 h-2 rounded-full bg-primary mx-auto animate-pulse shadow-[0_0_8px_rgba(152,203,255,0.8)]"></div>' : ''}
            </td>
            <td class="p-3 text-on-surface font-bold flex items-center gap-2">
              <span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary transition-colors">${icon}</span>
              <span class="${isSelected ? 'text-primary' : ''}">${escapeHtml(s.display_name || s.source_id)}</span>

            <td class="p-3 text-on-surface-variant">${escapeHtml(s.type || 'Universal Log Source')}</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 text-on-surface-variant">${escapeHtml(s.format || 'Syslog')}</td>
            <td class="p-3 text-right text-on-surface font-medium">${s.events_per_sec_str || '0'}</td>
            <td class="p-3 text-right">${anomalyPill}</td>
          </tr>
        `;
      }).join('') : `
        <tr>
          <td colspan="7" class="p-8 text-center text-on-surface-variant font-code-sm">
            NO ACTIVE SOURCES — No telemetry sources found in the '${activeCategory}' category.
          </td>
        </tr>
      `;

      // Parsing health mini-chart for Selected Source Inspector
      let inspectorHealthBarsHtml = '';
      if (selectedSource && selectedSource.parsing_health) {
        inspectorHealthBarsHtml = selectedSource.parsing_health.map(b => {
          if (b.has_error) {
            return `
              <div class="w-full bg-tertiary-container hover:bg-tertiary-container/80 transition-colors rounded-t border-t-2 border-tertiary shadow-[0_0_8px_rgba(235,129,4,0.5)] relative group cursor-pointer" style="height: ${b.pct}%;">

                  ${escapeHtml(b.label)}

            return `
              <div class="w-full bg-primary/20 hover:bg-primary/40 transition-colors rounded-t border-t border-primary/50 relative group cursor-pointer" style="height: ${b.pct}%;">
                <div class="hidden group-hover:block absolute -top-8 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface font-code-xs px-2 py-1 rounded text-xs z-20 whitespace-nowrap border border-outline-variant">
                  ${escapeHtml(b.label)}
                </div>
              </div>
            `;
          }
        }).join('');
      }

      // Inspector icon determination
      let inspectorIcon = 'dns';
      if (selectedSource) {
        if (selectedSource.category === 'FIREWALL') inspectorIcon = 'security';
        else if (selectedSource.category === 'WINDOWS') inspectorIcon = 'desktop_windows';
        else if (selectedSource.category === 'LINUX') inspectorIcon = 'terminal';
        else if ((selectedSource.source_id || '').toLowerCase().includes('android')) inspectorIcon = 'smartphone';
        else if ((selectedSource.source_id || '').toLowerCase().includes('mac')) inspectorIcon = 'laptop_mac';
        else if ((selectedSource.source_id || '').toLowerCase().includes('router') || (selectedSource.source_id || '').toLowerCase().includes('wifi')) inspectorIcon = 'router';
      }

      return `
        <div class="flex flex-col w-full h-full min-h-[calc(100vh-3.5rem)] relative overflow-hidden">
          <!-- Background Grid Canvas -->
          <div class="absolute inset-0 pointer-events-none opacity-20">
            <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <pattern height="32" id="grid-pattern-sources" patternUnits="userSpaceOnUse" width="32">
                  <circle class="fill-outline" cx="1" cy="1" r="1"></circle>
                </pattern>
              </defs>
              <rect fill="url(#grid-pattern-sources)" height="100%" width="100%"></rect>
            </svg>
          </div>

          <!-- Main Content Area -->
          <div class="flex-1 flex flex-col xl:flex-row relative z-10 w-full h-full">
            <!-- Left/Main Column: Overview, Topology & Source Table -->
            <div class="flex-1 flex flex-col min-w-0 h-full p-container-padding space-y-stack-lg overflow-y-auto">
              ${error ? `
                <div class="p-3 rounded-lg bg-error-container/20 border border-error-container text-error text-code-sm flex items-center justify-between">
                  <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-[18px]">warning</span>
                    <span>Telemetry Ingestion Warning: ${escapeHtml(error)}</span>
                  </div>
                  <button onclick="app.refreshCurrentPage()" class="btn btn-sm" style="border-color: #93000a; color: #ffb4ab;">Retry</button>
                </div>
              ` : ''}

              <!-- 1. Page Header & Quick Statistics -->
              <div class="flex flex-col md:flex-row md:items-end justify-between gap-stack-md">

                <div class="flex items-center gap-stack-md">

                  TOPOLOGY_MAP_LIVE
                </div>
                <h2 class="font-label-caps text-label-caps text-outline mb-stack-md">INGESTION PIPELINE</h2>
                <div class="flex items-center justify-between py-stack-md px-stack-lg">

    function renderBlockchainPage(overview = {}, blocks = [], auditResult = null) {
      const total = overview.total_blocks || 0;
      const status = overview.chain_status || 'VALID';
      const lastIdx = overview.last_block_index || 0;
      const lastHash = overview.last_block_hash || '—';
      const lastUpdated = overview.last_updated ? overview.last_updated.replace('T', ' ').slice(0, 19) : '—';

      let auditBanner = '';
      if (auditResult) {
        if (auditResult.valid) {
          auditBanner = `
            <div style="background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.4); padding:12px 16px; border-radius:8px; margin-bottom:16px; color:#34d399; font-size:13px;">
              <strong>✅ Full Blockchain Audit PASSED:</strong> All ${auditResult.verified_blocks} of ${auditResult.total_blocks} blocks are cryptographically valid with unbroken previous_hash linkage.
            </div>
          `;
        } else {
          auditBanner = `
            <div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); padding:12px 16px; border-radius:8px; margin-bottom:16px; color:#f87171; font-size:13px;">
              <strong>🚨 Blockchain Integrity Audit FAILED at Block #${auditResult.invalid_block}:</strong> ${auditResult.reason}
            </div>
          `;
        }
      }

      const rows = (blocks || []).map(b => {
        const isGenesis = b.block_index === 0;
        const prevShort = b.previous_hash ? (b.previous_hash.slice(0, 10) + '...' + b.previous_hash.slice(-6)) : '—';
        const blockShort = b.block_hash ? (b.block_hash.slice(0, 10) + '...' + b.block_hash.slice(-6)) : '—';
        const evtShort = b.event_hash ? (b.event_hash.slice(0, 10) + '...' + b.event_hash.slice(-6)) : '—';
        return `
          <tr>
            <td style="font-weight:700; color:#38bdf8;">#${b.block_index}</td>
            <td style="font-family:monospace; font-size:11px;">${b.timestamp.replace('T', ' ').replace('Z', '')}</td>
            <td style="font-family:monospace; font-size:12px;">${b.event_id}</td>
            <td><span class="fmt-pill" style="background:${isGenesis ? '#0369a1' : 'rgba(56,189,248,0.15)'};">${b.action}</span></td>
            <td style="font-family:monospace; font-size:11px; color:#a5f3fc;" title="${b.event_hash}">${evtShort}</td>
            <td style="font-family:monospace; font-size:11px; color:#94a3b8;" title="${b.previous_hash}">${prevShort}</td>
            <td style="font-family:monospace; font-size:11px; color:#4ade80;" title="${b.block_hash}">${blockShort}</td>
            <td>
              ${isGenesis ? '<span style="color:var(--text-muted); font-size:11px;">Anchor</span>' : `<button class="btn btn-sm" onclick="app.verifyBlockchainEvent('${b.event_id}')">🛡️ Verify</button>`}
            </td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="8" style="text-align:center; padding:20px; color:var(--text-muted);">No blockchain blocks recorded yet.</td></tr>';

      return `
        <div class="panel" style="border-color:#38bdf8; margin-bottom:20px;">
          <div class="panel-title">
            <div style="display:flex; align-items:center; gap:10px;">
              <span>⛓️ Local Blockchain Integrity & Chain-of-Custody</span>
              <span class="badge-offline">● Immutable SHA-256 Ledger</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button class="btn btn-primary" onclick="app.auditBlockchain()">🔍 Audit Entire Blockchain</button>
              <button class="btn" onclick="app.loadBlockchainData()">🔄 Refresh</button>
            </div>
          </div>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
            ULPF maintains a local, append-only blockchain ledger in DuckDB that cryptographically links every stored log's SHA-256 hash. Any unauthorized modification to stored logs in DuckDB breaks the hash comparison, providing verifiable, tamper-evident proof for cybersecurity and forensic investigations.
          </p>

          ${auditBanner}

          <div class="metrics-grid" style="margin-bottom:0;">
            <div class="metric-card">
              <div class="metric-title">Total Blocks</div>
              <div class="metric-value" style="color:#38bdf8;">${total.toLocaleString()}</div>
              <div class="metric-sub">Blocks in persistent ledger</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">Chain Status</div>
              <div class="metric-value" style="color:${status === 'VALID' ? 'var(--success)' : 'var(--danger)'};">
                ${status === 'VALID' ? '🟢 VALID' : '🔴 CORRUPTED'}
              </div>
              <div class="metric-sub">Continuous cryptographic links</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">Latest Block</div>
              <div class="metric-value" style="font-size:18px; color:var(--text);">#${lastIdx}</div>
              <div class="metric-sub">Tip timestamp: ${lastUpdated}</div>
            </div>
            <div class="metric-card">
              <div class="metric-title">Air-Gapped Node</div>
              <div class="metric-value" style="font-size:16px; color:#4ade80;">100% Local DuckDB</div>
              <div class="metric-sub">Zero external network dependency</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">
            <span>📜 Immutable Blockchain Ledger Records</span>
            <span style="font-size:12px; color:var(--text-muted);">Showing recent blocks (latest first)</span>
          </div>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>Block</th>
                  <th>Timestamp (UTC)</th>
                  <th>Event ID</th>
                  <th>Action</th>
                  <th>Event Hash (SHA-256)</th>
                  <th>Previous Hash</th>
                  <th>Block Hash</th>
                  <th>Integrity</th>
                </tr>
              </thead>
              <tbody>
                ${rows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ── Application State & Controller ─────────────────────────────────────
    class ULPFApp {
      constructor() {
        this.currentPage = 'dashboard';
        this.dashboardState = {
          summary: {
            events_processed: 0,
            raw_events_count: 0,
            normalized_count: 0,
            normalized_pct: 0,
            ocsf_events_count: 0,
            ocsf_pct: 0,
            unknown_formats_count: 0,
            anomalies_count: 0,
            blockchain_verified_count: 0
          },
          volume: { buckets: [], max_eps: 0, max_hourly_count: 0 },
          sources: { distribution: [], total_events: 0 },
          recentEvents: [],
          health: { status: 'online', api: 'online', database: 'online', ai: 'online', blockchain: 'online' },
          loading: false,
          error: null
        };
        this.state = {
          stats: {},
          anomalies: {},
          events: [],
          totalEvents: 0,
          sources: [],
          mappings: {}
        };
        this.blockchainState = {
          overview: {},
          blocks: [],
          auditResult: null
        };
        this.explorerState = {
          page: 1,
          pageSize: 100,
          formatFilter: 'all',
          sortOrder: 'created_at',
          searchVal: '',
          sourceFilter: null
        };
        this.sourcesState = {
          overview: {
            active_streams: 0,
            total_events_per_sec: 0,
            total_events_per_sec_str: '0',
            dropped_or_malformed: 0,
            pipeline_sources: []
          },
          sources: [],
          categoryCounts: { ALL: 0, WINDOWS: 0, LINUX: 0, FIREWALL: 0, ENDPOINT: 0 },
          activeCategory: 'ALL',
          selectedSourceId: null,
          isInspectorOpen: true,
          loading: false,
          error: null
        };
        this.ingestionState = {
          overview: { total_ingested: 0, total_ingested_str: '0 Events', active_jobs: 0 },
          jobs: [],
          selectedJobId: null,
          isPaused: false,
          isUploading: false,
          loading: false,
          error: null
        };
        this.lastConvertedJSON = null;
        this.lastBatchResult = null;
        this.currentModalEvent = null;
      }

      async init() {
        document.getElementById('nav-container').innerHTML = renderNavbar(this.currentPage);
        document.getElementById('modal-container').innerHTML = renderTraceModal();
        this.renderView();
        await this.loadDashboardData();
        await this.refreshCurrentPage();
      }

      async navigate(page) {
        this.currentPage = page;
        document.getElementById('nav-container').innerHTML = renderNavbar(this.currentPage);
        this.renderView();
        if (page === 'dashboard') {
          await this.loadDashboardData();
        } else if (page === 'ingestion' || page === 'converter') {
          await this.loadIngestionData();
        } else if (page === 'sources') {
          await this.loadSourcesData();
        } else if (page === 'explorer') {
          await this.loadExplorerEvents();
        } else if (page === 'blockchain') {
          await this.loadBlockchainData();
        } else if (page === 'onboarding' || page === 'mappings') {
          await this.refreshCurrentPage();
        }
      }

      async loadDashboardData() {
        this.dashboardState.loading = true;
        if (this.currentPage === 'dashboard') {
          this.renderView();
        }
        try {
          const [sumRes, volRes, srcRes, recRes, hltRes] = await Promise.all([
            fetch('/api/dashboard/summary'),
            fetch('/api/dashboard/event-volume'),
            fetch('/api/dashboard/source-distribution'),
            fetch('/api/dashboard/recent-events?limit=10'),
            fetch('/api/dashboard/system-health')
          ]);

          if (sumRes.ok) this.dashboardState.summary = await sumRes.json();
          if (volRes.ok) this.dashboardState.volume = await volRes.json();
          if (srcRes.ok) this.dashboardState.sources = await srcRes.json();
          if (recRes.ok) this.dashboardState.recentEvents = await recRes.json();
          if (hltRes.ok) {
            this.dashboardState.health = await hltRes.json();
            this.updateHealthIndicators(this.dashboardState.health);
          }
          this.dashboardState.loading = false;
          this.dashboardState.error = null;
        } catch (err) {
          console.error('Error fetching dashboard data:', err);
          this.dashboardState.loading = false;
          this.dashboardState.error = err.message || 'Subsystem communication error';
        }
        if (this.currentPage === 'dashboard') {
          this.renderView();
        }
      }

      async loadSourcesData() {
        this.sourcesState.loading = true;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
        try {
          const [ovRes, telRes] = await Promise.all([
            fetch('/api/sources/overview'),
            fetch('/api/sources/telemetry')
          ]);

          if (ovRes.ok) this.sourcesState.overview = await ovRes.json();
          if (telRes.ok) {
            const data = await telRes.json();
            this.sourcesState.sources = data.sources || [];
            this.sourcesState.categoryCounts = data.category_counts || {
              ALL: this.sourcesState.sources.length,
              WINDOWS: 0, LINUX: 0, FIREWALL: 0, ENDPOINT: 0
            };
            if (!this.sourcesState.selectedSourceId && this.sourcesState.sources.length > 0) {
              this.sourcesState.selectedSourceId = this.sourcesState.sources[0].source_id;
            }
          }
          this.sourcesState.loading = false;
          this.sourcesState.error = null;
        } catch (err) {
          console.error('Error fetching sources telemetry:', err);
          this.sourcesState.loading = false;
          this.sourcesState.error = err.message || 'Telemetry subsystem error';
        }
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      selectSource(sourceId) {
        this.sourcesState.selectedSourceId = sourceId;
        this.sourcesState.isInspectorOpen = true;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      closeInspector() {
        this.sourcesState.isInspectorOpen = false;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      openInspector() {
        this.sourcesState.isInspectorOpen = true;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      filterSources(category) {
        this.sourcesState.activeCategory = category || 'ALL';
        // Select first matching source if current selection is not in filtered category
        if (category && category !== 'ALL') {
          const matching = this.sourcesState.sources.filter(s => (s.category || '').toUpperCase() === category.toUpperCase());
          if (matching.length > 0) {
            this.sourcesState.selectedSourceId = matching[0].source_id;
          }
        }

        this.explorerState.sortOrder = 'created_at';

      async refreshCurrentPage() {
        if (this.currentPage === 'dashboard') {
          await this.loadDashboardData();
        } else if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          await this.loadIngestionData();
        } else if (this.currentPage === 'sources') {
          await this.loadSourcesData();
        }
        try {
          const [statsRes, anomalyRes, eventsRes, sourcesRes, mappingsRes] = await Promise.all([
            fetch('/stats'),
            fetch('/anomalies'),
            fetch(`/events?limit=${this.explorerState.pageSize}&offset=0&order_by=${this.explorerState.sortOrder}`),
            fetch('/sources'),
            fetch('/mappings'),
          ]);

          if (statsRes.ok) this.state.stats = await statsRes.json();
          if (anomalyRes.ok) this.state.anomalies = await anomalyRes.json();
          if (eventsRes.ok) {
            const data = await eventsRes.json();
            this.state.events = data.events || [];
            this.state.totalEvents = data.total || this.state.events.length;
          }
          if (sourcesRes.ok) {
            const data = await sourcesRes.json();
            this.state.sources = data.sources || [];
          }
          if (mappingsRes.ok) this.state.mappings = await mappingsRes.json();

          if (this.currentPage === 'blockchain') {
            await this.loadBlockchainData();
          } else if (this.currentPage !== 'converter' && this.currentPage !== 'dashboard' && this.currentPage !== 'sources') {
            this.renderView();
          }
        } catch (err) {
          console.error('Error refreshing state:', err);
        }
      }

      async loadExplorerEvents() {
        try {
          const offset = (this.explorerState.page - 1) * this.explorerState.pageSize;
          const params = new URLSearchParams({
            limit: this.explorerState.pageSize,
            offset: offset,
            order_by: this.explorerState.sortOrder,
            direction: 'desc'
          });
          if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
            params.append('format', this.explorerState.formatFilter);
          }
          if (this.explorerState.sourceFilter) {
            params.append('source', this.explorerState.sourceFilter);
          }
          if (this.explorerState.searchVal) {
            params.append('search', this.explorerState.searchVal);
          }

          const res = await fetch('/events?' + params.toString());
          if (res.ok) {
            const data = await res.json();
            this.state.events = data.events || [];
            this.state.totalEvents = data.total || 0;
            this.renderView();
          }
        } catch (err) {
          console.error('Error loading explorer events:', err);
        }
      }

      onSortChange() {

      renderView() {
        const root = document.getElementById('app-root');
        switch (this.currentPage) {
          case 'ingestion':
          case 'converter':
            root.innerHTML = `<div class="p-stack-lg">${renderIngestionPage(this.ingestionState)}</div>`;
            break;
          case 'dashboard':
            root.innerHTML = renderDashboardPage(this.dashboardState);
            break;
          case 'sources':
            root.innerHTML = renderSourcesPage(this.sourcesState);
            break;
          case 'explorer':
            root.innerHTML = `<div class="p-6">${renderLogExplorerPage(

              this.explorerState.sortOrder,

      // ── Ingestion Console Methods ──────────────────────────────────────────
      async loadIngestionData() {
        this.ingestionState.loading = true;
        try {
          const [ovRes, jobsRes] = await Promise.all([
            fetch('/api/ingest/overview'),
            fetch('/api/ingest/jobs')
          ]);
          if (ovRes.ok) this.ingestionState.overview = await ovRes.json();
          if (jobsRes.ok) {
            const data = await jobsRes.json();
            this.ingestionState.jobs = data.jobs || [];
            if (!this.ingestionState.selectedJobId && this.ingestionState.jobs.length > 0) {
              this.ingestionState.selectedJobId = this.ingestionState.jobs[0].job_id;
            }
          }
        } catch (e) {
          console.error("Failed to load ingestion data", e);
          this.ingestionState.error = e.message;
        } finally {
          this.ingestionState.loading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            this.renderView();
            this.scrollFeedToBottom();
          }
        }
      }

      selectJob(jobId) {
        this.ingestionState.selectedJobId = jobId;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
          this.scrollFeedToBottom();
        }
      }

      toggleFeedPause() {
        this.ingestionState.isPaused = !this.ingestionState.isPaused;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }
      }

      clearFeed() {
        const selectedJob = this.ingestionState.jobs.find(j => j.job_id === this.ingestionState.selectedJobId);
        if (selectedJob) {
          selectedJob.logs = [];
        }
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }
      }

      scrollFeedToBottom() {
        setTimeout(() => {
          const feed = document.getElementById('live-log-feed');
          if (feed && !this.ingestionState.isPaused) {
            feed.scrollTop = feed.scrollHeight;
          }
        }, 50);
      }

      handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        const dz = document.getElementById('drop-zone');
        if (dz) {
          dz.classList.add('border-primary', 'bg-primary-container/20');
        }
      }

      handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        const dz = document.getElementById('drop-zone');
        if (dz) {
          dz.classList.remove('border-primary', 'bg-primary-container/20');
        }
      }

      handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        this.handleDragLeave(e);
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          this.handleFilesUpload(e.dataTransfer.files);
        }
      }

      handleFileInputChange(e) {
        if (e.target && e.target.files && e.target.files.length > 0) {
          this.handleFilesUpload(e.target.files);
        }
      }

      async handleFilesUpload(fileList) {
        if (!fileList || fileList.length === 0) return;
        this.ingestionState.isUploading = true;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }

        const formData = new FormData();
        for (let i = 0; i < fileList.length; i++) {
          formData.append('files', fileList[i]);
        }

        try {
          const res = await fetch('/api/ingest/upload', {
            method: 'POST',
            body: formData
          });
          const result = await res.json();
          await this.loadIngestionData();
          if (result && result.job) {
            this.ingestionState.selectedJobId = result.job.job_id;
          }
        } catch (err) {
          console.error("Upload error:", err);
          alert("Ingestion error: " + err.message);
        } finally {
          this.ingestionState.isUploading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            this.renderView();
            this.scrollFeedToBottom();
          }
        }
      }

      downloadJSON(obj, filename = 'normalized_result.json') {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", filename);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      }

          return;

        const events = this.lastBatchResult.processed_events.map(item => item.normalized_event);
        const rawName = (this.lastBatchResult.file_name || 'batch_events').replace(/\.[^/.]+$/, "");
        const fileName = `${rawName}_normalized.json`;
        this.downloadJSON(events, fileName);

      async handleSingleFileConvert() {
        const fileInput = document.getElementById('converter-file-input');
        const textInput = document.getElementById('converter-text-input');
        const statusBox = document.getElementById('converter-status');
        const previewBox = document.getElementById('converter-preview');
        const copyBtn = document.getElementById('copy-json-btn');
        const btn = document.getElementById('converter-btn');

        const formData = new FormData();
        let label = 'direct_snippet.json';
        if (fileInput?.files?.length > 0) {
          formData.append('file', fileInput.files[0]);
          label = fileInput.files[0].name.replace(/\.[^/.]+$/, "") + "_normalized.json";
        } else if (textInput?.value?.trim()) {
          formData.append('raw_text', textInput.value.trim());
          label = 'single_snippet_normalized.json';
        } else {
          alert('Please enter or select a log file/snippet first.');
          return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Converting...';
        statusBox.className = 'upload-status loading';
        statusBox.innerText = 'Converting single file to normalized JSON...';

        try {
          const res = await fetch('/convert', { method: 'POST', body: formData });
          if (!res.ok) throw new Error(await res.text());
          const jsonText = await res.text();
          const parsedData = JSON.parse(jsonText);
          this.lastConvertedJSON = parsedData;

          previewBox.innerText = JSON.stringify(parsedData, null, 2);
          if (copyBtn) copyBtn.style.display = 'inline-flex';

          statusBox.className = 'upload-status success';
          statusBox.innerHTML = `
            <div style="font-weight:600; margin-bottom:4px;">✅ Converted ${parsedData.length} event(s) successfully!</div>
            <div style="font-size:11px; margin-bottom:8px;">Only your single file/snippet was processed.</div>
            <button class="btn btn-sm btn-success" onclick="app.downloadJSON(app.lastConvertedJSON, '${label}')">📥 Download ${label}</button>
          `;

          // Automatically trigger download
          this.downloadJSON(parsedData, label);
        } catch (err) {
          statusBox.className = 'upload-status error';
          statusBox.innerText = '❌ Error converting: ' + err.message;
        } finally {
          btn.disabled = false;
          btn.innerText = '⚡ Convert & Download JSON';
        }
      }

      copyConverterJSON() {
        if (this.lastConvertedJSON) {
          navigator.clipboard.writeText(JSON.stringify(this.lastConvertedJSON, null, 2));
          alert('Copied normalized JSON to clipboard!');
        }
      }

      async handleUpload() {
        const fileInput = document.getElementById('log-file-input');
        const textInput = document.getElementById('raw-log-input');
        const statusBox = document.getElementById('upload-status');
        const btn = document.getElementById('ingest-btn');

        const formData = new FormData();
        let label = '';
        if (fileInput?.files?.length > 0) {
          formData.append('file', fileInput.files[0]);
          label = fileInput.files[0].name;
        } else if (textInput?.value?.trim()) {
          formData.append('raw_text', textInput.value.trim());
          label = 'Direct Text';
        } else {
          alert('Please choose a file or enter log text.');
          return;
        }

        btn.disabled = true;
        btn.innerText = '⏳ Ingesting...';
        statusBox.className = 'upload-status loading';
        statusBox.innerText = `Ingesting ${label}...`;

        try {
          const res = await fetch('/upload', { method: 'POST', body: formData });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();

          this.lastBatchResult = data;
          this.renderView();

          // Also refresh general stats in background
          const statsRes = await fetch('/stats');
          if (statsRes.ok) this.state.stats = await statsRes.json();
        } catch (err) {
          statusBox.className = 'upload-status error';
          statusBox.innerText = '❌ Error: ' + err.message;
        } finally {
          const curBtn = document.getElementById('ingest-btn');
          if (curBtn) {
            curBtn.disabled = false;
            curBtn.innerText = '🚀 Ingest into Database';
          }
        }
      }

      async registerSource() {
        const name = document.getElementById('new-src-name').value;
        const fmt = document.getElementById('new-src-format').value;
        const vendor = document.getElementById('new-src-vendor').value;
        const prod = document.getElementById('new-src-product').value;

        try {
          const res = await fetch('/sources', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source_name: name, format: fmt, vendor, product: prod }),
          });
          if (!res.ok) throw new Error(await res.text());
          alert('Source registered successfully!');
          await this.refreshCurrentPage();
        } catch (err) {
          alert('Failed to register: ' + err.message);
        }
      }

      async suggestMapping() {
        const input = document.getElementById('ai-sample-keys').value;
        if (!input.trim()) return;
        const keys = input.split(',').map(s => s.trim()).filter(Boolean);
        const resBox = document.getElementById('ai-mapping-result');
        resBox.innerHTML = '<span style="color:#7dd3fc;">Running AI confidence matching...</span>';

        try {
          const res = await fetch('/mappings/suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sample_keys: keys, sample_values: {} }),
          });
          const data = await res.json();
          const rows = data.mappings.map(m => `
            <tr>
              <td style="font-family:monospace; color:#38bdf8;">${m.source_field}</td>
              <td style="font-family:monospace; color:#4ade80;">${m.suggested_ocsf_field}</td>
              <td><span class="sev-badge ${m.confidence >= 0.8 ? 'sev-low' : 'sev-medium'}">${(m.confidence*100).toFixed(0)}%</span></td>
            </tr>
          `).join('');

          resBox.innerHTML = `
            <div style="font-size:12px; margin-bottom:6px;">Overall Alignment Confidence: <strong>${(data.overall_confidence*100).toFixed(0)}%</strong></div>
            <table>
              <thead><tr><th>Source Key</th><th>Suggested OCSF Attribute</th><th>Confidence</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        } catch (err) {
          resBox.innerHTML = `<span style="color:#f87171;">Error: ${err.message}</span>`;
        }
      }
    }

    const app = new ULPFApp();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
