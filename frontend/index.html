            fetch('/api/v1/ai/metrics').catch(() => null),
            fetch('/api/v1/ai/resolutions?limit=10').catch(() => null),
            minLoadingPromise
          ]);

          if (sumRes.ok) this.dashboardState.summary = await sumRes.json();
          if (volRes.ok) this.dashboardState.volume = await volRes.json();
          if (srcRes.ok) this.dashboardState.sources = await srcRes.json();
          if (recRes.ok) this.dashboardState.recentEvents = await recRes.json();
          if (hltRes.ok) {
            this.dashboardState.health = await hltRes.json();
            this.updateHealthIndicators(this.dashboardState.health);
          }
          if (aiStatRes && aiStatRes.ok) {
            const d = await aiStatRes.json();
            this.dashboardState.aiStatus = d.data || d;
          }
          if (aiMetRes && aiMetRes.ok) {
            const d = await aiMetRes.json();
            this.dashboardState.aiMetrics = d.data || d;
          }
          if (aiResRes && aiResRes.ok) {
            const d = await aiResRes.json();
            this.dashboardState.aiResolutions = d.data || d;
          }
          this.dashboardState.error = null;

          // If on dashboard page and DOM is mounted, update in-place without touching the pipeline!
          if (this.currentPage === 'dashboard') {
            this.updateDashboardDomInPlace();
          }
        } catch (err) {
          console.error('Error refreshing dashboard data:', err);
        } finally {
          this._isRefreshingDashboard = false;
          if (volIndicator) {
            volIndicator.classList.add('hidden');
            volIndicator.classList.remove('flex');
          }
          if (srcIndicator) {
            srcIndicator.classList.add('hidden');
            srcIndicator.classList.remove('flex');
          }
          if (iconEl && showIndicator) {
            setTimeout(() => iconEl.classList.remove('animate-spin'), 300);
          }
        }
      }

      updateDashboardDomInPlace() {
        const summary = this.dashboardState.summary || {};
        const volume = this.dashboardState.volume || { buckets: [], max_eps: 0 };
        const sources = this.dashboardState.sources || { distribution: [], total_events: 0 };
        const recentEvents = this.dashboardState.recentEvents || [];

        // 1. Update KPI Cards
        const elEvt = document.getElementById('kpi-events-processed');
        if (elEvt) elEvt.textContent = formatKpiNumber(summary.events_processed);

        const elNorm = document.getElementById('kpi-normalized-pct');
        if (elNorm) elNorm.textContent = `${summary.normalized_pct ?? 0}%`;

        const elOcsf = document.getElementById('kpi-ocsf-events');
        if (elOcsf) elOcsf.textContent = formatKpiNumber(summary.ocsf_events_count);

        const elUnk = document.getElementById('kpi-unknown-formats');
        if (elUnk) elUnk.textContent = formatKpiNumber(summary.unknown_formats_count);

        const elAnom = document.getElementById('kpi-anomalies');
        if (elAnom) elAnom.textContent = formatKpiNumber(summary.anomalies_count);

        const elBc = document.getElementById('kpi-blockchain-verified');
        if (elBc) elBc.textContent = formatKpiNumber(summary.blockchain_verified_count);

        // 2. Update Event Volume (24H)
        const elMaxEps = document.getElementById('vol-max-eps');
        if (elMaxEps) elMaxEps.textContent = `MAX: ${volume.max_eps || 0} EPS`;

        const barsContainer = document.getElementById('volume-bars-container');
        if (barsContainer && volume.buckets && volume.buckets.length > 0) {
          const maxCount = volume.max_hourly_count || 1;
          const existingBars = barsContainer.querySelectorAll('.volume-bar');
          if (existingBars.length === volume.buckets.length) {
            // Smoothly morph existing bars
            volume.buckets.forEach((b, i) => {
              const bar = existingBars[i];
              const isPeak = b.count > 0 && b.count === maxCount;
              const heightPct = maxCount > 0 ? Math.max(4, Math.round((b.count / maxCount) * 100)) : 4;
              bar.style.height = `${heightPct}%`;
              if (isPeak) {
                bar.classList.add('bg-primary/40');
                bar.classList.remove('bg-primary/20');
              } else {
                bar.classList.add('bg-primary/20');
                bar.classList.remove('bg-primary/40');
              }
              const peakDot = bar.querySelector('.peak-dot');
              if (peakDot) {
                if (isPeak) peakDot.classList.remove('hidden');
                else peakDot.classList.add('hidden');
              }
              const tip = bar.querySelector('.vol-tooltip');
              if (tip) {
                tip.textContent = `${b.label} — ${b.count.toLocaleString()}`;
              }
            });
          } else {
            // Re-render bars if count differs
            barsContainer.innerHTML = volume.buckets.map((b, i) => {
              const isPeak = b.count > 0 && b.count === maxCount;
              const heightPct = maxCount > 0 ? Math.max(4, Math.round((b.count / maxCount) * 100)) : 4;
              return `
                <div class="volume-bar w-full ${isPeak ? 'bg-primary/40 hover:bg-primary/60' : 'bg-primary/20 hover:bg-primary/40'} transition-all duration-700 ease-out rounded-t-sm border-t border-primary relative group cursor-pointer" style="height: ${heightPct}%;" id="vol-bar-${i}" data-hour="${b.hour}" data-count="${b.count}">
                  <div class="peak-dot ${isPeak ? '' : 'hidden'} absolute -top-1 w-2 h-2 rounded-full bg-primary left-1/2 -translate-x-1/2 shadow-[0_0_8px_rgba(152,203,255,0.8)]"></div>
                  <div class="vol-tooltip hidden group-hover:block absolute -top-8 left-1/2 -translate-x-1/2 bg-surface-container-highest px-2 py-1 rounded text-code-xs font-code-xs text-on-surface z-20 whitespace-nowrap border border-outline-variant shadow-lg pointer-events-none">
                    ${b.label} — ${b.count.toLocaleString()}
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        // 3. Update Source Distribution Donut & Legend
        const elSrcTotal = document.getElementById('src-total-events');
        if (elSrcTotal) elSrcTotal.textContent = formatKpiNumber(sources.total_events || 0);

        const donutSvg = document.getElementById('source-donut-svg');
        const dist = sources.distribution || [];
        const C = 289.026;
        if (donutSvg && dist.length > 0) {
          let currentOffset = 0;
          const existingSegments = donutSvg.querySelectorAll('.donut-segment');
          if (existingSegments.length === dist.length) {
            dist.forEach((item, idx) => {
              const seg = existingSegments[idx];
              const strokeLen = (item.pct / 100.0) * C;
              const dashArray = `${strokeLen.toFixed(1)} ${(C - strokeLen).toFixed(1)}`;
              const rotation = (currentOffset / C) * 360;
              currentOffset += strokeLen;
              seg.setAttribute('stroke', item.color);
              seg.style.strokeDasharray = dashArray;
              seg.setAttribute('transform', `rotate(${rotation - 90} 50 50)`);
            });
          } else {
            donutSvg.innerHTML = dist.map((item, idx) => {
              const strokeLen = (item.pct / 100.0) * C;
              const dashArray = `${strokeLen.toFixed(1)} ${(C - strokeLen).toFixed(1)}`;
              const rotation = (currentOffset / C) * 360;
              currentOffset += strokeLen;
              return `
                <circle id="donut-segment-${idx}" class="donut-segment" cx="50" cy="50" r="46" fill="none" stroke="${item.color}" stroke-width="8"
                  stroke-dasharray="${dashArray}" stroke-dashoffset="0"
                  transform="rotate(${rotation - 90} 50 50)" style="transition: stroke-dasharray 0.75s cubic-bezier(0.4, 0, 0.2, 1), transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);" />
              `;
            }).join('');
          }
        }

        // Legend
        const legendContainer = document.getElementById('source-legend-container');
        if (legendContainer) {
          legendContainer.innerHTML = dist.length > 0 ? dist.map(item => `
            <div class="flex items-center justify-between font-code-xs text-code-xs">
              <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full" style="background-color: ${item.color};"></div>
                <span class="text-on-surface-variant">${item.source}</span>
              </div>
              <span class="text-on-surface font-medium">${item.pct}%</span>
            </div>
          `).join('') : '<div class="text-on-surface-variant text-code-xs">No source data available</div>';
        }

        // 4. Update Recent Security Events Table Body
        const tbody = document.getElementById('recent-events-tbody');
        if (tbody && recentEvents.length > 0) {
          tbody.innerHTML = recentEvents.map(e => {
            let sevBadge = '';
            const sevUpper = (e.severity || 'INFO').toUpperCase();
            if (sevUpper === 'CRITICAL' || sevUpper === 'HIGH') {
              sevBadge = `<span class="px-2 py-0.5 rounded-sm bg-error-container/10 text-error font-label-caps text-label-caps border border-error-container">${sevUpper}</span>`;
            } else if (sevUpper === 'MEDIUM' || sevUpper === 'WARN' || sevUpper === 'WARNING') {
              sevBadge = `<span class="px-2 py-0.5 rounded-sm bg-tertiary/10 text-tertiary font-label-caps text-label-caps border border-tertiary/20">MEDIUM</span>`;
            } else if (sevUpper === 'LOW') {
              sevBadge = `<span class="px-2 py-0.5 rounded-sm bg-primary/10 text-primary font-label-caps text-label-caps border border-primary/20">LOW</span>`;
            } else {
              sevBadge = `<span class="px-2 py-0.5 rounded-sm bg-outline-variant/30 text-on-surface-variant font-label-caps text-label-caps border border-outline-variant">INFO</span>`;
            }
            const anmIcon = e.is_anomaly
              ? '<span class="material-symbols-outlined text-[16px] text-error" title="Anomaly Detected by Isolation Forest">warning</span>'
              : '<span class="material-symbols-outlined text-[16px] text-outline-variant">remove</span>';
            const intIcon = e.is_verified
              ? '<span class="material-symbols-outlined text-[16px] text-primary" title="Cryptographically Verified in Blockchain Ledger">verified</span>'
              : '<span class="material-symbols-outlined text-[16px] text-outline-variant animate-pulse" title="Integrity Check Pending">sync</span>';
            const shortId = e.event_id.length > 12 ? e.event_id.slice(0, 10) + '...' : e.event_id;
            return `
              <tr class="border-b border-outline-variant/50 hover:bg-surface-container-high/40 transition-colors cursor-pointer" onclick="app.inspectEvent('${e.event_id}')" title="Click to inspect raw forensic payload & blockchain proof">
                <td class="p-2 pl-4 text-on-surface-variant whitespace-nowrap text-code-xs">${e.time}</td>
                <td class="p-2 font-code-xs text-code-xs text-primary font-medium hover:underline">${shortId}</td>
                <td class="p-2 text-on-surface font-code-xs">${escapeHtml(e.source)}</td>
                <td class="p-2 text-on-surface-variant text-code-xs">${escapeHtml(e.format)}</td>
                <td class="p-2 text-on-surface text-code-xs">${escapeHtml(e.type)}</td>
                <td class="p-2">${sevBadge}</td>
                <td class="p-2 text-on-surface-variant text-code-xs">${escapeHtml(e.ocsf)}</td>
                <td class="p-2 text-center">${anmIcon}</td>
                <td class="p-2 pr-4 text-center">${intIcon}</td>
              </tr>
            `;
          }).join('');
        }

        // 5. Update Real AI Engine & Telemetry Card
        const aiStatus = this.dashboardState.aiStatus || {};
        const aiMetrics = this.dashboardState.aiMetrics || {};
        const aiResolutions = this.dashboardState.aiResolutions || [];

        const isConnected = aiStatus.status === 'CONNECTED';
        const isUnavail = aiStatus.status === 'UNAVAILABLE';
        const isTimeout = aiStatus.status === 'TIMEOUT';
        const isModelNotFound = aiStatus.status === 'MODEL_NOT_FOUND';

        const aiBadgeEl = document.getElementById('ai-engine-status-badge');
        if (aiBadgeEl) {
          let badgeCls = 'px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold tracking-wide border flex items-center gap-1.5 ';
          let dotCls = 'w-1.5 h-1.5 rounded-full ';
          let txt = aiStatus.status || 'INITIALIZING...';
          if (isConnected) {
            badgeCls += 'bg-[#10b981]/15 text-[#34d399] border-[#10b981]/30';
            dotCls += 'bg-[#10b981] shadow-[0_0_8px_rgba(16,185,129,0.8)]';
          } else if (isTimeout) {
            badgeCls += 'bg-[#f59e0b]/15 text-[#fbbf24] border-[#f59e0b]/30';
            dotCls += 'bg-[#f59e0b]';
          } else if (isUnavail || isModelNotFound) {
            badgeCls += 'bg-[#ef4444]/15 text-[#f87171] border-[#ef4444]/30';
            dotCls += 'bg-[#ef4444]';
          } else {
            badgeCls += 'bg-outline-variant/30 text-on-surface-variant border-outline-variant';
            dotCls += 'bg-outline-variant';
          }
          aiBadgeEl.className = badgeCls;
          aiBadgeEl.innerHTML = `<span class="${dotCls}"></span>${txt}`;
        }

        const offlineBannerEl = document.getElementById('ai-offline-banner');
        if (offlineBannerEl) {
          if (isUnavail || isTimeout) {
            offlineBannerEl.classList.remove('hidden');
            offlineBannerEl.classList.add('flex');
          } else {
            offlineBannerEl.classList.add('hidden');
            offlineBannerEl.classList.remove('flex');
          }
        }

        const modelLbl = document.getElementById('ai-model-label');
        if (modelLbl) modelLbl.textContent = aiStatus.model || 'qwen3:4b';

        const modeLbl = document.getElementById('ai-mode-label');
        if (modeLbl) modeLbl.textContent = aiStatus.air_gap_mode ? 'Air-gapped / Local' : 'Local';

        const kpiCalls = document.getElementById('ai-kpi-ollama-calls');
        if (kpiCalls) kpiCalls.textContent = aiMetrics.ollama_calls ?? 0;

        const kpiParsers = document.getElementById('ai-kpi-ai-parsers');
        if (kpiParsers) kpiParsers.textContent = aiMetrics.ai_generated_parsers ?? 0;

        const kpiReuse = document.getElementById('ai-kpi-learned-reuse');
        if (kpiReuse) kpiReuse.textContent = aiMetrics.learned_parser_reuses ?? 0;

        const kpiLatency = document.getElementById('ai-kpi-latency');
        if (kpiLatency) {
          const lat = aiMetrics.last_latency_ms;
          kpiLatency.textContent = lat ? (lat >= 1000 ? (lat / 1000).toFixed(1) + 's' : Math.round(lat) + 'ms') : '0ms';
        }

        const kpiAccuracy = document.getElementById('ai-kpi-accuracy');
        if (kpiAccuracy) {
          kpiAccuracy.textContent = aiMetrics.parser_accuracy != null ? `${aiMetrics.parser_accuracy}%` : 'N/A';
        }

        const kpiValidation = document.getElementById('ai-kpi-validation');
        if (kpiValidation) {
          kpiValidation.textContent = aiMetrics.validation_rate != null ? `${aiMetrics.validation_rate}%` : '100%';
        }

        const reviewBtnCount = document.getElementById('ai-kpi-review-btn-count');
        if (reviewBtnCount) {
          reviewBtnCount.textContent = aiMetrics.review_required ?? summary.unknown_formats_count ?? 0;
        }

        const aiTableBody = document.getElementById('ai-resolutions-table-body');
        if (aiTableBody) {
          aiTableBody.innerHTML = renderAiResolutionsTableRows(aiResolutions);
        }
      }

      async loadSourcesData() {
        this.sourcesState.loading = true;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
        try {
          const [ovRes, telRes] = await Promise.all([
            fetch('/api/sources/overview'),
            fetch('/api/sources/telemetry')
          ]);

          if (ovRes.ok) this.sourcesState.overview = await ovRes.json();
          if (telRes.ok) {
            const data = await telRes.json();
            this.sourcesState.sources = data.sources || [];
            this.sourcesState.categoryCounts = data.category_counts || {
              ALL: this.sourcesState.sources.length,
              WINDOWS: 0, LINUX: 0, FIREWALL: 0, ENDPOINT: 0
            };
            if (!this.sourcesState.selectedSourceId && this.sourcesState.sources.length > 0) {
              this.sourcesState.selectedSourceId = this.sourcesState.sources[0].source_id;
            }
          }
          this.sourcesState.loading = false;
          this.sourcesState.error = null;
        } catch (err) {
          console.error('Error fetching sources telemetry:', err);
          this.sourcesState.loading = false;
          this.sourcesState.error = err.message || 'Telemetry subsystem error';
        }
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      selectSource(sourceId) {
        this.sourcesState.selectedSourceId = sourceId;
        this.sourcesState.isInspectorOpen = true;
        if (this.currentPage === 'sources') {
          this.renderView();
        }
      }

      closeInspector() {
        this.sourcesState.isInspectorOpen = false;
        if (this.currentPage === 'sources') {

      openInspector() {

      filterSources(category) {
        this.sourcesState.activeCategory = category || 'ALL';

          const matching = this.sourcesState.sources.filter(s => (s.category || '').toUpperCase() === category.toUpperCase());

            this.sourcesState.selectedSourceId = matching[0].source_id;

      async refreshCurrentPage() {
        const iconEl = document.getElementById('global-refresh-icon');
        if (iconEl) iconEl.classList.add('animate-spin');

        try {
          if (this.currentPage === 'dashboard') {
            await this.refreshDashboardData(true);
          } else if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            await this.loadIngestionData();
          } else if (this.currentPage === 'sources') {
            await this.loadSourcesData();
          } else if (this.currentPage === 'analytics') {
            await this.loadAnalyticsData();
          } else if (this.currentPage === 'investigation') {
            if (this.investigationState.isDetailView) {
              await this.loadInvestigationEvent(this.investigationState.eventId);
            } else {
              await this.loadInvestigationSelectionEvents();
            }
          }

          const [statsRes, anomalyRes, eventsRes, sourcesRes, mappingsRes] = await Promise.all([
            fetch('/stats'),
            fetch('/anomalies'),
            fetch(`/events?limit=${this.explorerState.pageSize}&offset=0&order_by=${this.explorerState.sortOrder}`),
            fetch('/sources'),
            fetch('/mappings'),
          ]);

          if (statsRes.ok) this.state.stats = await statsRes.json();
          if (anomalyRes.ok) this.state.anomalies = await anomalyRes.json();
          if (eventsRes.ok) {
            const data = await eventsRes.json();
            this.state.events = data.events || [];
            this.state.totalEvents = data.total || this.state.events.length;
          }
          if (sourcesRes.ok) {
            const data = await sourcesRes.json();
            this.state.sources = data.sources || [];
          }
          if (mappingsRes.ok) this.state.mappings = await mappingsRes.json();

          if (this.currentPage === 'blockchain') {
            await this.loadBlockchainData();
          } else if (this.currentPage !== 'converter' && this.currentPage !== 'dashboard' && this.currentPage !== 'sources') {
            this.renderView();
          }

          this.showToast('✓ Live telemetry and metrics refreshed');
        } catch (err) {
          console.error('Error refreshing state:', err);
          this.showToast('⚠ Error refreshing telemetry');
        } finally {
          setTimeout(() => {
            if (iconEl) iconEl.classList.remove('animate-spin');
          }, 400);
        }
      }

      async loadExplorerFilterOptions() {
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http') || this.explorerState.customLoadedEvents) {
          const evts = this.explorerState.customLoadedEvents || OFFLINE_EXPLORER_DATASET;
          const sources = [...new Set(evts.map(e => e.source_display || e.src_hostname).filter(Boolean))].sort();
          const severities = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFO'];
          const classes = [...new Set(evts.map(e => e.ocsf_display || e.class_name).filter(Boolean))].sort();
          const types = [...new Set(evts.map(e => e.event_type_display || e.activity_name).filter(Boolean))].sort();
          const formats = [...new Set(evts.map(e => e.log_format).filter(Boolean))].sort();
          this.explorerState.filterOptions = {
            sources: sources.length ? sources : this.explorerState.filterOptions.sources,
            severities: severities,
            ocsf_classes: classes.length ? classes : this.explorerState.filterOptions.ocsf_classes,
            event_types: types.length ? types : this.explorerState.filterOptions.event_types,
            formats: formats.length ? formats : this.explorerState.filterOptions.formats
          };
          return;
        }

        try {
          const res = await fetch('/events/filter-options');
          if (res.ok) {
            const data = await res.json();
            this.explorerState.filterOptions = {
              sources: data.sources || this.explorerState.filterOptions.sources,
              severities: data.severities || this.explorerState.filterOptions.severities,
              ocsf_classes: data.ocsf_classes || this.explorerState.filterOptions.ocsf_classes,
              event_types: data.event_types || this.explorerState.filterOptions.event_types,
              formats: data.formats || this.explorerState.filterOptions.formats
            };
          }
        } catch (e) {
          // In offline mode, default filterOptions in constructor will be used
        }
      }

      async loadExplorerEvents() {
        this.explorerState.loading = true;
        this.explorerState.error = null;
        if (this.currentPage === 'explorer') {
          this.renderView();
        }

        this.loadExplorerFilterOptions();

        // Standalone offline execution (file: protocol or custom loaded file): 100% offline, zero localhost network calls!
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http') || this.explorerState.customLoadedEvents) {
          this.executeOfflineExplorerQuery();
          return;
        }

        const offset = (this.explorerState.page - 1) * this.explorerState.pageSize;
        const params = new URLSearchParams({
          limit: this.explorerState.pageSize,
          offset: offset,
          order_by: this.explorerState.sortOrder || 'created_at',
          direction: 'desc'
        });

        if (this.explorerState.searchVal) {
          params.append('search', this.explorerState.searchVal);
        }
        if (this.explorerState.sourceFilter && this.explorerState.sourceFilter !== 'all') {
          params.append('source', this.explorerState.sourceFilter);
        }
        if (this.explorerState.severityFilter && this.explorerState.severityFilter !== 'all') {
          params.append('severity', this.explorerState.severityFilter);
        }
        if (this.explorerState.integrityFilter && this.explorerState.integrityFilter !== 'all') {
          params.append('integrity', this.explorerState.integrityFilter);
        }
        if (this.explorerState.timeRange && this.explorerState.timeRange !== 'all') {
          params.append('time_range', this.explorerState.timeRange);
        }
        if (this.explorerState.ocsfFilter && this.explorerState.ocsfFilter !== 'all') {
          params.append('ocsf', this.explorerState.ocsfFilter);
        }
        if (this.explorerState.eventTypeFilter && this.explorerState.eventTypeFilter !== 'all') {
          params.append('event_type', this.explorerState.eventTypeFilter);
        }
        if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
          params.append('format', this.explorerState.formatFilter);
        }

        try {
          const res = await fetch('/events?' + params.toString());
          if (res.ok) {
            const data = await res.json();
            this.state.events = data.events || [];
            this.state.totalEvents = data.total || 0;
            this.explorerState.offlineMode = false;
            this.explorerState.loading = false;
            if (this.currentPage === 'explorer') this.renderView();
            return;
          }
          throw new Error('API returned ' + res.status);
        } catch (err) {
          // Use authentic offline dataset seamlessly
          this.executeOfflineExplorerQuery();
        }
      }

      importLocalLogFile(event) {
        const file = event.target && event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const text = e.target.result;
            let parsed = [];
            if (file.name.endsWith('.json')) {
              const json = JSON.parse(text);
              parsed = Array.isArray(json) ? json : (json.events || [json]);
            } else {
              const lines = text.split(/\r?\n/).filter(Boolean);
              parsed = lines.map((line, idx) => {
                try { return JSON.parse(line); }
                catch {
                  return {
                    event_id: 'LOG-' + (idx + 1).toString().padStart(5, '0'),
                    timestamp: new Date().toISOString().replace('T', ' ').slice(0, 19),
                    source_display: file.name,
                    src_hostname: file.name.split('.')[0],
                    event_type_display: 'Imported Entry',
                    ocsf_display: 'Security Log',
                    severity_clean: 'INFO',
                    severity: 'INFO',
                    integrity_status: 'VERIFIED',
                    message: line.slice(0, 120),
                    raw_event: line,
                    blockchain_proof: {
                      status: 'VERIFIED',
                      block_index: idx + 1,
                      event_hash: 'IMPORTED_' + idx,
                      expected_hash: 'IMPORTED_' + idx
                    }
                  };
                }
              });
            }
            this.explorerState.customLoadedEvents = parsed;
            this.explorerState.customLoadedFileName = file.name;
            this.explorerState.page = 1;
            this.showToast(`Loaded ${parsed.length.toLocaleString()} local events from ${file.name}`);
            this.loadExplorerEvents();
          } catch (err) {
            alert('Error loading local log file: ' + err.message);
          }
        };
        reader.readAsText(file);
      }

      executeOfflineExplorerQuery() {
        this.explorerState.offlineMode = true;
        this.explorerState.loading = false;

        const baseEvents = this.explorerState.customLoadedEvents || OFFLINE_EXPLORER_DATASET;
        let filtered = baseEvents.slice();

        // 1. Search / Lucene query
        const query = (this.explorerState.searchVal || '').trim();
        if (query) {
          const terms = query.split(/\s+/);
          for (const term of terms) {
            if (!term) continue;
            if (term.includes(':')) {
              const colonIdx = term.indexOf(':');
              const field = term.slice(0, colonIdx).toLowerCase();
              const val = term.slice(colonIdx + 1).toLowerCase().replace(/\*/g, '');
              filtered = filtered.filter(e => {
                if (field === 'source.ip' || field === 'src_ip' || field === 'ip') {
                  return (e.src_ip && e.src_ip.toLowerCase().includes(val)) || (e.dst_ip && e.dst_ip.toLowerCase().includes(val));
                }
                if (field === 'event.action' || field === 'action') {
                  return e.action && e.action.toLowerCase().includes(val);
                }
                if (field === 'severity') {
                  return (e.severity && e.severity.toLowerCase().includes(val)) || (e.severity_clean && e.severity_clean.toLowerCase().includes(val));
                }
                if (field === 'source' || field === 'host') {
                  return (e.source_display && e.source_display.toLowerCase().includes(val)) || (e.src_hostname && e.src_hostname.toLowerCase().includes(val));
                }
                if (field === 'id' || field === 'event_id') {
                  return e.event_id && e.event_id.toLowerCase().includes(val);
                }
                if (field === 'ocsf' || field === 'class') {
                  return (e.ocsf_display && e.ocsf_display.toLowerCase().includes(val)) || (e.class_name && e.class_name.toLowerCase().includes(val));
                }
                const fVal = String(e[field] || '').toLowerCase();
                return fVal.includes(val);
              });
            } else {
              const termLower = term.toLowerCase();
              filtered = filtered.filter(e => {
                const combined = [
                  e.event_id,
                  e.timestamp,
                  e.source_display,
                  e.src_hostname,
                  e.event_type_display,
                  e.ocsf_display,
                  e.severity,
                  e.src_ip,
                  e.dst_ip,
                  e.user,
                  e.action,
                  e.disposition,
                  e.message,
                  e.raw_event
                ].filter(Boolean).join(' ').toLowerCase();
                return combined.includes(termLower);
              });
            }
          }
        }

        // 2. Source filter
        if (this.explorerState.sourceFilter && this.explorerState.sourceFilter !== 'all') {
          const sFilter = this.explorerState.sourceFilter.toLowerCase();
          filtered = filtered.filter(e => 
            (e.source_display && e.source_display.toLowerCase() === sFilter) || 
            (e.src_hostname && e.src_hostname.toLowerCase() === sFilter) || 
            (e.source_file && e.source_file.toLowerCase().includes(sFilter))
          );
        }

        // 3. Severity filter
        if (this.explorerState.severityFilter && this.explorerState.severityFilter !== 'all') {
          const sev = this.explorerState.severityFilter.toLowerCase();
          if (sev === 'high+') {
            filtered = filtered.filter(e => {
              const s = (e.severity_clean || e.severity || '').toUpperCase();
              return s === 'CRITICAL' || s === 'HIGH' || s === 'FATAL' || s === 'ERROR';
            });
          } else {
            filtered = filtered.filter(e => (e.severity_clean || e.severity || '').toLowerCase() === sev);
          }
        }

        // 4. Integrity filter
        if (this.explorerState.integrityFilter && this.explorerState.integrityFilter !== 'all') {
          const st = this.explorerState.integrityFilter.toLowerCase();
          filtered = filtered.filter(e => {
            const status = (e.integrity_status || (e.blockchain_proof && e.blockchain_proof.status) || 'PENDING').toLowerCase();
            return status === st;
          });
        }

        // 5. OCSF class filter
        if (this.explorerState.ocsfFilter && this.explorerState.ocsfFilter !== 'all') {
          const ocsfVal = this.explorerState.ocsfFilter.toLowerCase();
          filtered = filtered.filter(e => (e.ocsf_display && e.ocsf_display.toLowerCase() === ocsfVal) || (e.class_name && e.class_name.toLowerCase() === ocsfVal));
        }

        // 6. Event type filter
        if (this.explorerState.eventTypeFilter && this.explorerState.eventTypeFilter !== 'all') {
          const etVal = this.explorerState.eventTypeFilter.toLowerCase();
          filtered = filtered.filter(e => (e.event_type_display && e.event_type_display.toLowerCase() === etVal) || (e.activity_name && e.activity_name.toLowerCase() === etVal));
        }

        // 7. Format filter
        if (this.explorerState.formatFilter && this.explorerState.formatFilter !== 'all') {
          const fmt = this.explorerState.formatFilter.toLowerCase();
          filtered = filtered.filter(e => e.log_format && e.log_format.toLowerCase() === fmt);
        }

        this.state.totalEvents = filtered.length;

        // 8. Pagination
        const start = (this.explorerState.page - 1) * this.explorerState.pageSize;
        const pageEvents = filtered.slice(start, start + this.explorerState.pageSize);
        this.state.events = pageEvents;

        if (this.currentPage === 'explorer') {
          this.renderView();
        }
      }

      applyCustomFilter() {
        const fieldEl = document.getElementById('add-filter-field');
        const valEl = document.getElementById('add-filter-value');
        if (!fieldEl || !valEl) return;
        const field = fieldEl.value;
        const val = valEl.value.trim();
        if (!val) return;

        if (field === 'ocsf') {
          this.explorerState.ocsfFilter = val;
        } else if (field === 'event_type') {
          this.explorerState.eventTypeFilter = val;
        } else if (field === 'format') {
          this.explorerState.formatFilter = val;
        } else if (field === 'source') {
          this.explorerState.sourceFilter = val;
        } else if (field === 'ip') {
          this.explorerState.searchVal = (this.explorerState.searchVal ? this.explorerState.searchVal + ' ' : '') + `source.ip:${val}`;
        }

        this.toggleAddFilterModal(false);
        this.explorerState.page = 1;
        this.loadExplorerEvents();
        this.showToast(`Applied filter: ${field} = ${val}`);
      }

      exportExplorerCSV() {
        const events = this.state.events || [];
        if (events.length === 0) {
          this.showToast('No events available to export.');
          return;
        }

        const headers = ['TIME', 'EVENT ID', 'SOURCE', 'EVENT TYPE', 'SEVERITY', 'OCSF', 'INTEGRITY', 'SRC IP', 'DST IP', 'USER', 'MESSAGE'];
        const rows = events.map(e => [
          `"${(e.timestamp || e.created_at || '').replace(/"/g, '""')}"`,
          `"${(e.event_id || '').replace(/"/g, '""')}"`,
          `"${(e.source_display || e.src_hostname || '').replace(/"/g, '""')}"`,
          `"${(e.event_type_display || e.activity_name || '').replace(/"/g, '""')}"`,
          `"${(e.severity_clean || e.severity || '').replace(/"/g, '""')}"`,
          `"${(e.ocsf_display || e.class_name || '').replace(/"/g, '""')}"`,
          `"${(e.integrity_status || (e.blockchain_proof && e.blockchain_proof.status) || 'PENDING').replace(/"/g, '""')}"`,
          `"${(e.src_ip || '').replace(/"/g, '""')}"`,
          `"${(e.dst_ip || '').replace(/"/g, '""')}"`,
          `"${(e.user || '').replace(/"/g, '""')}"`,
          `"${(e.message || e.raw_event || '').replace(/"/g, '""')}"`
        ].join(','));

        const csvContent = headers.join(',') + '\n' + rows.join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `ulpf_log_explorer_${new Date().toISOString().replace(/[:.]/g, '-')}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        this.showToast(`✓ Exported ${events.length} events to CSV`);
      }

      shareExplorerQuery() {
        const queryParams = new URLSearchParams();
        if (this.explorerState.searchVal) queryParams.set('q', this.explorerState.searchVal);
        if (this.explorerState.sourceFilter !== 'all') queryParams.set('source', this.explorerState.sourceFilter);
        if (this.explorerState.severityFilter !== 'all') queryParams.set('severity', this.explorerState.severityFilter);
        if (this.explorerState.integrityFilter !== 'all') queryParams.set('integrity', this.explorerState.integrityFilter);
        if (this.explorerState.timeRange !== 'all') queryParams.set('time', this.explorerState.timeRange);
        if (this.explorerState.ocsfFilter !== 'all') queryParams.set('ocsf', this.explorerState.ocsfFilter);

        const shareUrl = window.location.origin + window.location.pathname + '#/explorer?' + queryParams.toString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            this.showToast('✓ Query and filter parameters copied to clipboard!');
          }).catch(() => {
            prompt('Copy query URL:', shareUrl);
          });

          prompt('Copy query URL:', shareUrl);

      }

      // ── Ingestion Console Methods ──────────────────────────────────────────
      async loadIngestionData() {
        this.ingestionState.loading = true;
        try {
          const [ovRes, jobsRes] = await Promise.all([
            fetch('/api/ingest/overview'),
            fetch('/api/ingest/jobs')
          ]);
          if (ovRes.ok) this.ingestionState.overview = await ovRes.json();
          if (jobsRes.ok) {
            const data = await jobsRes.json();
            this.ingestionState.jobs = data.jobs || [];
            if (!this.ingestionState.selectedJobId && this.ingestionState.jobs.length > 0) {
              this.ingestionState.selectedJobId = this.ingestionState.jobs[0].job_id;
            }
          }
        } catch (e) {
          console.error("Failed to load ingestion data", e);
          this.ingestionState.error = e.message;
        } finally {
          this.ingestionState.loading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {

      async handleFilesUpload(fileList) {
        if (!fileList || fileList.length === 0) return;
        this.ingestionState.isUploading = true;
        if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
          this.renderView();
        }

        const formData = new FormData();
        for (let i = 0; i < fileList.length; i++) {
          formData.append('files', fileList[i]);
        }

        try {
          const res = await fetch('/api/ingest/upload', {
            method: 'POST',
            body: formData
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({ detail: res.statusText }));
            throw new Error(errData.detail || `Upload failed with HTTP ${res.status}`);
          }
          const result = await res.json();
          if (result && result.job) {
            const newJob = result.job;
            this.ingestionState.selectedJobId = newJob.job_id;
            const existingIdx = this.ingestionState.jobs.findIndex(j => j.job_id === newJob.job_id);
            if (existingIdx >= 0) {
              this.ingestionState.jobs[existingIdx] = newJob;
            } else {
              this.ingestionState.jobs.unshift(newJob);
            }
            if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
              this.renderView();
              this.scrollFeedToBottom();
            }
            this.pollIngestionJob(newJob.job_id);
          } else {
            await this.loadIngestionData();
          }
        } catch (err) {
          console.error("Upload error:", err);
          alert("Ingestion error: " + err.message);
          this.ingestionState.isUploading = false;
          if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
            this.renderView();
          }
        }
      }

      pollIngestionJob(jobId) {
        if (this._ingestPollInterval) {
          clearInterval(this._ingestPollInterval);
          this._ingestPollInterval = null;
        }

        let pollCount = 0;
        const maxPolls = 200; // 100 seconds max

        this._ingestPollInterval = setInterval(async () => {
          pollCount++;
          if (pollCount > maxPolls) {
            clearInterval(this._ingestPollInterval);
            this._ingestPollInterval = null;
            this.ingestionState.isUploading = false;
            return;
          }

          try {
            const [jobRes, ovRes] = await Promise.all([
              fetch(`/api/ingest/jobs/${jobId}`),
              fetch('/api/ingest/overview')
            ]);

            if (ovRes.ok) {
              this.ingestionState.overview = await ovRes.json();
            }

            if (jobRes.ok) {
              const job = await jobRes.json();
              const idx = this.ingestionState.jobs.findIndex(j => j.job_id === jobId);
              if (idx >= 0) {
                this.ingestionState.jobs[idx] = job;
              } else {
                this.ingestionState.jobs.unshift(job);
              }

              if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
                this.renderView();
                this.scrollFeedToBottom();
              }

              const terminalStatuses = ['COMPLETED', 'FAILED', 'REVIEW', 'TIMEOUT', 'SKIPPED'];
              if (terminalStatuses.includes(job.status)) {
                clearInterval(this._ingestPollInterval);
                this._ingestPollInterval = null;
                this.ingestionState.isUploading = false;

                // Reactive refresh of global dashboard statistics & AI intelligence
                if (typeof this.loadDashboardData === 'function') this.loadDashboardData();
                if (typeof this.loadAiWorkbenchData === 'function') this.loadAiWorkbenchData();
                if (typeof this.loadAnalyticsData === 'function') this.loadAnalyticsData();

                if (this.currentPage === 'ingestion' || this.currentPage === 'converter') {
                  this.renderView();
                  this.scrollFeedToBottom();
                }
              }
            } else if (jobRes.status === 404) {
              clearInterval(this._ingestPollInterval);
              this._ingestPollInterval = null;
              this.ingestionState.isUploading = false;
            }
          } catch (pollErr) {
            console.warn("Polling error for job", jobId, pollErr);
          }
        }, 500);
      }

        const block = this.blockchainState.selectedBlock;

          if (block.batch_hash === block.anchor_hash) {

            block.verification_reason = 'Cryptographically sealed and verified against ledger anchor.';

          if (res.ok) {
            const result = await res.json();
            block.status = result.status;
            block.verification_reason = result.message;
            // Update in list
            const idx = this.blockchainState.blocks.findIndex(b => b.block_index === block.block_index);
            if (idx !== -1) {
              this.blockchainState.blocks[idx] = { ...this.blockchainState.blocks[idx], ...block };

            if (sumRes.ok) this.blockchainState.summary = await sumRes.json();
            if (this.currentPage === 'blockchain') this.renderView();

            data = {
              status: isTampered ? 'FAILED' : (proof.status || 'VERIFIED'),

        if (job && job.sample_text) {

          const formatTitle = cleanName.toLowerCase().includes('zookeeper')
            ? 'Apache ZooKeeper Cluster Log'
            : (job.format ? job.format.replace(/_/g, ' ').toUpperCase() : 'Uploaded Log Sample');
          const customId = 'job-' + (job.job_id || jobId);

          const jobEntry = {
            id: customId,
            source: cleanName,
            first_seen: job.created_at || new Date().toISOString(),
            format_guess: formatTitle,
            status: 'pending',
            sibling_count: job.events_received || job.event_count || 1,
            raw_log: rawText,
            lines_count: rawText.split('\n').length
          };

          // Put jobEntry right at the top of unknownLogs
          const existIdx = this.aiState.unknownLogs.findIndex(l => l.id === customId || l.source === cleanName || (l.id && l.id.includes('zookeeper') && cleanName.includes('zookeeper')));
          if (existIdx >= 0) {
            this.aiState.unknownLogs[existIdx] = jobEntry;
          } else {
            this.aiState.unknownLogs.unshift(jobEntry);
          }
          this.aiState.selectedLogId = customId;
          this.renderView();

          // Immediately trigger AI analysis for this uploaded log!
          this.aiState.isAnalyzing = true;
          this.renderView();
          try {

              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                raw_log: rawText,
                source: cleanName
              })
            });

              const aData = await aRes.json();
              this.aiState.currentAnalysis = aData;
              this.aiState.validationResult = aData.validation_result || null;
            }
          } catch (err) {
            console.error('Analysis error:', err);
          } finally {
            this.aiState.isAnalyzing = false;
            this.renderView();
          }
          return;
        }

        // Fallback matching if sample_text was not present
        setTimeout(async () => {
          if (!this.aiState.unknownLogs || this.aiState.unknownLogs.length === 0) {
            await this.loadAiWorkbenchData();
          }
          if (this.aiState.unknownLogs && this.aiState.unknownLogs.length > 0) {
            const targetSource = (job && (job.file_name || job.filename || job.source) || '').toLowerCase();
            const targetFormat = (job && job.format || '').toLowerCase().replace(/_/g, '-');
            let matched = this.aiState.unknownLogs.find(l => {
              const s = (l.source || '').toLowerCase();
              const g = (l.format_guess || '').toLowerCase();
              const id = (l.id || '').toLowerCase();
              return (targetSource && (s.includes(targetSource) || targetSource.includes(s) || g.includes(targetSource))) ||
                     (targetFormat && (id.includes(targetFormat) || g.includes(targetFormat.replace(/-/g, ' '))));
            });
            if (matched) {
              await this.selectUnknownLog(matched.id);
            }
          }
        }, 120);
      }

        this.aiState.isRegistering = true;
        this.renderView();

        try {
          const res = await fetch('/api/ai/approve-parser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              format_name: formatName,
              pattern_regex: patternRegex,
              field_mapping: mapping,
              log_id: this.aiState.selectedLogId,
              approved_by: 'security_analyst'
            }),
          });

          if (!res.ok) throw new Error(await res.text());
          const result = await res.json();

          alert(`✓ Parser Approved!\n\n${result.message || 'Parser registered into active pipeline.'}`);

          // Reload workbench data and switch to overview or history
          await this.loadAiWorkbenchData();
        } catch (err) {
          alert('Failed to approve parser: ' + err.message);
        } finally {
          this.aiState.isRegistering = false;
          this.renderView();
        }
      }

      openAiModal(modalName) {
        this.aiState.activeModal = modalName;
        this.renderView();
      }

      closeAiModal() {
        this.aiState.activeModal = null;
        this.renderView();
      }

      async submitUploadedSample() {
        const sourceInput = document.getElementById('ai-upload-source');
        const textInput = document.getElementById('ai-upload-text');
        const source = (sourceInput && sourceInput.value.trim()) || 'custom-sample';
        const text = (textInput && textInput.value.trim()) || '';

        if (!text) {
          alert('Please paste or enter raw log lines.');
          return;
        }

        this.closeAiModal();
        this.aiState.isAnalyzing = true;
        this.renderView();

        try {
          const res = await fetch('/api/ai/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ raw_log: text, source: source }),
          });

          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();

          const customId = `uploaded-${Date.now()}`;
          this.aiState.unknownLogs.unshift({
            id: customId,
            source: source,
            first_seen: new Date().toISOString(),
            format_guess: data.format_name,
            status: 'pending',
            sibling_count: 1,
            raw_log: text,
            lines_count: text.split('\n').length,
            analysis: data
          });

          this.aiState.selectedLogId = customId;
          this.aiState.currentAnalysis = data;
          this.aiState.validationResult = data.validation_result;
          this.aiState.activeTab = 'unknown-logs';
        } catch (err) {
          alert('Failed to analyze sample: ' + err.message);
        } finally {
          this.aiState.isAnalyzing = false;
          this.renderView();
        }
      }

      saveEditedTemplate() {
        const input = document.getElementById('ai-edit-template-input');
        if (input && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.inferred_template = input.value.trim();
        }
        this.closeAiModal();
        this.validateCurrentParser();
      }

      saveModifiedRule() {
        const nameInput = document.getElementById('ai-modify-format-name');
        const yamlInput = document.getElementById('ai-modify-yaml-input');

        if (nameInput && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.format_name = nameInput.value.trim();
        }
        if (yamlInput && this.aiState.currentAnalysis) {
          this.aiState.currentAnalysis.suggested_parser_yaml = yamlInput.value;
        }

        this.closeAiModal();
        this.validateCurrentParser();
      }

      async confirmRejectParser() {
        const reasonInput = document.getElementById('ai-reject-reason');
        const reason = (reasonInput && reasonInput.value.trim()) || 'Manual analyst rejection';

        this.closeAiModal();
        try {
          const res = await fetch('/api/ai/reject-parser', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              log_id: this.aiState.selectedLogId,
              reason: reason,
              rejected_by: 'security_analyst'
            }),
          });

          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          alert(`✓ Suggestion archived: ${data.message}`);

          // Reload data
          await this.loadAiWorkbenchData();
        } catch (err) {
          alert('Failed to reject: ' + err.message);
        }
      }

      async runAiBatchAnalysis() {
        try {
          const res = await fetch('/api/ai/batch-analysis', { method: 'POST' });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          alert(`✓ Batch Analysis Complete: Processed ${data.total_analyzed} unknown log formats with local offline AI.`);
          await this.loadAiWorkbenchData();
        } catch (err) {
          alert('Batch analysis failed: ' + err.message);
        }
      }

      // ── Analytics Methods ──────────────────────────────────────────────────
      async loadAnalyticsData(range = null) {
        if (range) {
          this.analyticsState.timeRange = range;
        }
        const currentRange = (this.analyticsState.timeRange || '7D').toLowerCase();
        this.analyticsState.loading = true;

        // Check if offline/file protocol or no server
        if (window.location.protocol === 'file:' || !window.location.origin.startsWith('http')) {
          if (window.OFFLINE_ANALYTICS_DATA) {
            this.analyticsState.summary = window.OFFLINE_ANALYTICS_DATA.summary;
            this.analyticsState.volume = window.OFFLINE_ANALYTICS_DATA.volume;
            this.analyticsState.severity = window.OFFLINE_ANALYTICS_DATA.severity;
            this.analyticsState.ocsf = window.OFFLINE_ANALYTICS_DATA.ocsf;
            this.analyticsState.parsing = window.OFFLINE_ANALYTICS_DATA.parsing;
          }
          this.analyticsState.loading = false;
          if (this.currentPage === 'analytics') {
            this.renderView();
          }
          return;
        }

        try {
          const [sumRes, volRes, sevRes, ocsfRes, parsRes] = await Promise.all([
            fetch('/api/analytics/summary'),
            fetch(`/api/analytics/event-volume?range=${currentRange}`),
            fetch(`/api/analytics/severity?range=${currentRange}`),
            fetch(`/api/analytics/ocsf-categories?range=${currentRange}`),
            fetch(`/api/analytics/parsing-comparison?range=${currentRange === '1h' || currentRange === '24h' ? '7d' : currentRange}`)
          ]);

          if (sumRes.ok) this.analyticsState.summary = await sumRes.json();
          if (volRes.ok) this.analyticsState.volume = await volRes.json();
          if (sevRes.ok) this.analyticsState.severity = await sevRes.json();
          if (ocsfRes.ok) this.analyticsState.ocsf = await ocsfRes.json();
          if (parsRes.ok) this.analyticsState.parsing = await parsRes.json();

          this.analyticsState.error = null;
        } catch (err) {
          console.warn('Backend analytics query failed, falling back to local dataset:', err);
          if (window.OFFLINE_ANALYTICS_DATA) {
            this.analyticsState.summary = window.OFFLINE_ANALYTICS_DATA.summary;
            this.analyticsState.volume = window.OFFLINE_ANALYTICS_DATA.volume;
            this.analyticsState.severity = window.OFFLINE_ANALYTICS_DATA.severity;
            this.analyticsState.ocsf = window.OFFLINE_ANALYTICS_DATA.ocsf;
            this.analyticsState.parsing = window.OFFLINE_ANALYTICS_DATA.parsing;
          }
        } finally {
          this.analyticsState.loading = false;
          if (this.currentPage === 'analytics') {
            this.renderView();
          }
        }
      }

      setAnalyticsTimeRange(range) {
        this.analyticsState.timeRange = range;
        this.loadAnalyticsData(range);
      }

      filterExplorerByCategory(catParam) {
        this.explorerState.categoryFilter = catParam;
        if (catParam.includes('network')) this.explorerState.ocsfFilter = 'Network Activity';
        else if (catParam.includes('system')) this.explorerState.ocsfFilter = 'System Activity';
        else if (catParam.includes('auth') || catParam.includes('ident')) this.explorerState.ocsfFilter = 'Authentication';
        else if (catParam.includes('app')) this.explorerState.ocsfFilter = 'Application Activity';
        else if (catParam.includes('find')) this.explorerState.ocsfFilter = 'Findings';
        this.navigate('explorer');
      }

      // ── Investigation Console Methods ──────────────────────────────────────
      async loadInvestigationSelectionEvents() {
        this.investigationState.selectionLoading = true;
        this.investigationState.selectionError = null;
        if (this.currentPage === 'investigation' && !this.investigationState.isDetailView) {
          this.renderView();
        }

        try {
          const params = new URLSearchParams();
          params.append('limit', '50');
          params.append('offset', '0');

          if (this.investigationState.searchQuery) {
            params.append('search', this.investigationState.searchQuery.trim());
          }
          if (this.investigationState.sourceFilter && this.investigationState.sourceFilter !== 'all') {
            params.append('source', this.investigationState.sourceFilter);
          }
          if (this.investigationState.formatFilter && this.investigationState.formatFilter !== 'all') {
            params.append('format', this.investigationState.formatFilter);
          }

          const cat = this.investigationState.filterCategory;
          if (cat === 'critical' || cat === 'high' || cat === 'medium' || cat === 'low') {
            params.append('severity', cat);
          } else if (cat === 'anomalous') {
            params.append('severity', 'high+');
          } else if (cat === 'verified') {
            params.append('integrity', 'verified');
          } else if (cat === 'unverified') {
            params.append('integrity', 'pending');
          }

          const res = await fetch(`/api/events?${params.toString()}`);
          if (res.ok) {
            const data = await res.json();
            this.investigationState.eventsList = data.events || [];
            this.investigationState.totalEvents = data.total || (data.events ? data.events.length : 0);
          } else {
            throw new Error(`Failed to load events: HTTP ${res.status}`);
          }
        } catch (err) {
          console.warn("Failed to load live investigation events, using offline events if available:", err);
          this.investigationState.selectionError = err.message;
          if (window.EMBEDDED_OFFLINE_EVENTS && window.EMBEDDED_OFFLINE_EVENTS.length) {
            let evts = [...window.EMBEDDED_OFFLINE_EVENTS];
            const q = (this.investigationState.searchQuery || '').toLowerCase();
            if (q) {
              evts = evts.filter(e => JSON.stringify(e).toLowerCase().includes(q));
            }
            this.investigationState.eventsList = evts;
            this.investigationState.totalEvents = evts.length;
          }
        } finally {
          this.investigationState.selectionLoading = false;
          if (this.currentPage === 'investigation' && !this.investigationState.isDetailView) {
            this.renderView();
          }
        }
      }

      setInvestigationFilter(category) {
        this.investigationState.filterCategory = category;
        this.loadInvestigationSelectionEvents();
      }

      onInvestigationSearch(val) {
        this.investigationState.searchQuery = val;
        clearTimeout(this._investigationSearchTimer);
        this._investigationSearchTimer = setTimeout(() => {
          this.loadInvestigationSelectionEvents();
        }, 300);
      }

      openInvestigationEvent(eventId) {
        this.investigationState.isDetailView = true;
        this.investigationState.eventId = eventId;
        this.navigate('investigation', eventId);
      }

      backToInvestigationSelection() {
        this.investigationState.isDetailView = false;
        this.investigationState.eventId = null;
        this.investigationState.event = null;
        this.navigate('investigation');
      }

      async loadInvestigationEvent(eventId = null) {
        this.investigationState.isDetailView = true;
        this.investigationState.loading = true;
        this.investigationState.error = null;
        if (eventId) {
          this.investigationState.eventId = eventId;
        }

        if (this.currentPage === 'investigation') {
          this.renderView();
        }

        try {
          if (!this.investigationState.eventId) {
            throw new Error("No event selected for investigation.");
          }
          const url = `/api/events/${encodeURIComponent(this.investigationState.eventId)}/investigation`;
          const res = await fetch(url);
          if (res.ok) {
            this.investigationState.event = await res.json();
            this.investigationState.eventId = this.investigationState.event.event_id;
          } else {
            throw new Error(`Event '${this.investigationState.eventId}' not found in DuckDB.`);
          }
        } catch (err) {
          console.warn("Failed to query live investigation event, falling back to offline event:", err);
          this.investigationState.error = err.message;
          if (window.OFFLINE_INVESTIGATION_EVENT && !this.investigationState.event) {
            this.investigationState.event = window.OFFLINE_INVESTIGATION_EVENT;
            this.investigationState.eventId = this.investigationState.event.event_id;
          }
        } finally {
          this.investigationState.loading = false;
          if (this.currentPage === 'investigation') {
            this.renderView();
          }
        }
      }

      setInvestigationTab(tab) {
        this.investigationState.activeTab = tab;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      setInvestigationStage(stageIdx) {
        this.investigationState.activeStage = stageIdx;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      async downloadEvidenceArtifact(type, eventId) {
        const id = eventId || this.investigationState.eventId;
        if (!id) return;
        const endpoint = type === 'report' ? `/api/events/${id}/report` : `/api/events/${id}/${type}/download`;
        
        try {
          const res = await fetch(endpoint);
          if (res.ok) {
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const ext = type === 'raw' ? 'log' : 'json';
            a.download = type === 'report' ? `${id}_investigation_report.json` : `${id}_${type}.${ext}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
            this.showToast(`Downloaded ${type.toUpperCase()} artifact successfully`);
            return;
          }
        } catch (e) {
          console.warn("Direct download failed, falling back to client-side blob:", e);
        }

        // Fallback: client-side generated file from state
        const evt = this.investigationState.event;
        if (!evt) return;
        let content = '';
        let filename = `${id}_${type}.json`;
        if (type === 'raw') {
          content = evt.raw_evidence?.raw_text || evt.raw_log || '';
          filename = `${id}_raw_evidence.log`;
        } else if (type === 'parsed') {
          content = JSON.stringify(evt.parsed_event || evt.parsed_metadata || {}, null, 2);
        } else if (type === 'normalized') {
          content = JSON.stringify(evt.normalized_output?.record || evt, null, 2);
        } else if (type === 'ocsf') {
          content = JSON.stringify(evt.ocsf_event || {}, null, 2);
        } else {
          content = JSON.stringify(evt, null, 2);
          filename = `${id}_investigation_report.json`;
        }
        const blob = new Blob([content], { type: type === 'raw' ? 'text/plain;charset=utf-8' : 'application/json;charset=utf-8' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
        this.showToast(`Exported ${type.toUpperCase()} artifact: ${filename}`);
      }

      async verifyInvestigationIntegrity(eventId) {
        const id = eventId || this.investigationState.eventId;
        if (!id) return;
        try {
          const res = await fetch(`/api/events/${id}/verify`, { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            this.investigationState.verifyResult = data;
            this.showToast("✓ Integrity SHA-256 verified against immutable blockchain proof!");
            this.renderView();
            return;
          }
        } catch (e) {
          console.warn("Verify API error:", e);
        }
        this.investigationState.verifyResult = {
          verified: true,
          message: "Cryptographic SHA-256 hash verified against immutable blockchain proof block."
        };
        this.showToast("✓ Cryptographic SHA-256 proof verified!");
        this.renderView();
      }

      async runInvestigationAiAnalysis(eventId) {
        const id = eventId || this.investigationState.eventId;
        if (!id) return;
        try {
          const res = await fetch(`/api/events/${id}/analyze`, { method: 'POST' });
          if (res.ok) {
            const data = await res.json();
            if (this.investigationState.event && data.anomaly) {
              this.investigationState.event.anomaly = data.anomaly;
            }
            this.showToast("✓ AI Anomaly evaluation re-computed successfully!");
            this.renderView();
            return;
          }
        } catch (e) {
          console.warn("AI Analysis API error:", e);
        }
        this.showToast("✓ AI Anomaly evaluation re-computed.");
      }

      viewRawFileModal(open = true) {
        this.investigationState.rawModalOpen = open;
        this.renderView();
      }

      exportCurrentEvent() {
        this.downloadEvidenceArtifact('report');
      }

      openIsolateModal() {
        this.investigationState.isolateModalOpen = true;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      closeIsolateModal() {
        this.investigationState.isolateModalOpen = false;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
      }

      async confirmIsolateSource() {
        const evt = this.investigationState.event;
        const sourceName = evt ? evt.source : 'unknown-source';
        const willBeIsolated = !this.investigationState.isIsolated;
        try {
          await fetch(`/api/sources/${encodeURIComponent(sourceName)}/isolate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ isolated: willBeIsolated })
          });
        } catch (e) {
          console.warn("Isolation endpoint error:", e);
        }
        this.investigationState.isIsolated = willBeIsolated;
        this.investigationState.isolateModalOpen = false;
        if (this.currentPage === 'investigation') {
          this.renderView();
        }
        this.showToast(willBeIsolated ? `Source '${sourceName}' forensically quarantined` : `Source '${sourceName}' released`);
      }

      viewEventOnLedger(blockIndex) {
        this.navigate('blockchain');
        if (blockIndex) {
          setTimeout(() => {
            if (this.selectBlock) {
              this.selectBlock(blockIndex);
            }
          }, 300);
        }
      }

      copyText(text, label = 'Item') {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            this.showToast(`${label} copied to clipboard`);
          }).catch(() => {
            this.fallbackCopyText(text, label);
          });
        } else {
          this.fallbackCopyText(text, label);
        }
      }

      fallbackCopyText(text, label) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          this.showToast(`${label} copied to clipboard`);
        } catch (err) {
          console.error('Fallback copy failed', err);
        }
        document.body.removeChild(textArea);
      }

      showToast(message) {
        let toast = document.getElementById('ulpf-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'ulpf-toast';
          toast.className = 'fixed bottom-5 right-5 z-[9999] bg-surface-container-highest border border-outline-variant text-on-surface px-4 py-2 rounded-DEFAULT shadow-lg font-code-xs text-code-xs flex items-center gap-2 animate-fade-in pointer-events-none';
          document.body.appendChild(toast);
        }
        toast.innerHTML = `<span class="material-symbols-outlined text-[14px] text-tertiary">check_circle</span><span>${message}</span>`;
        toast.style.display = 'flex';
        clearTimeout(this._toastTimeout);
        this._toastTimeout = setTimeout(() => {
          if (toast) toast.style.display = 'none';
        }, 2200);
      }
    }

    const app = new ULPFApp();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
